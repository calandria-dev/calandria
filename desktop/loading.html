<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>Starting Calandria…</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0b0d10; color: #e6e8eb;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* Both states are laid out the same way; only one of them is ever on
         screen. The wrapper exists so main.js can swap them with one property
         each, instead of hiding three elements by name. */
      .stack {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        max-width: 520px; text-align: center; padding: 0 24px;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .2px; }
      .sub { color: #8b939c; font-size: 12.5px; }
      .spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2.5px solid #1e232b; border-top-color: #4c9aff;
        animation: spin .9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* The spinner is the only thing on screen that says "still going", so
         when it can't turn, fall back to something that still changes. */
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
      }
      /* A cold Next boot is a few seconds; a first-ever launch can be much
         longer, and a spinner alone in that window reads as a hang. There's no need to
         narrate the whole boot to say so, say it only once the wait is long
         enough to worry about, with a delayed, non-repeating animation, so no
         script is needed (this page's CSP blocks its own inline <script>). */
      .slow {
        color: #6b737c; font-size: 12px; opacity: 0;
        animation: appear .4s ease-out 12s forwards;
      }
      @keyframes appear { to { opacity: 1; } }
      /* main.js appends sidecar output here with executeJavaScript, which is not
         subject to this page's CSP. It is off screen: the lines are
         diagnostics, not something to read while waiting, and they are the only
         surviving copy of the supervisor's FIRST lines (desktop/e2e reads them
         back through this element, since Electron stdout capture starts too
         late to see them). Hidden by clipping, not `display: none`, so it
         is still rendered and still has innerText. */
      #log {
        position: absolute; width: 1px; height: 1px;
        overflow: hidden; clip-path: inset(50%); white-space: pre-wrap;
      }
      /* The unreachable-instance state. This document has no script, so only
         main.js fills in the detail
         and wires the two buttons when an attach fails. */
      #detail { color: #8b939c; font-size: 12.5px; word-break: break-word; }
      #fail .buttons { display: flex; gap: 10px; }
      #fail button {
        background: #1a2029; color: #e6e8eb; border: 1px solid #262d38; border-radius: 6px;
        padding: 7px 14px; font: inherit; cursor: pointer;
      }
      #fail button:hover { background: #222a35; }
      #fail button.primary { background: #2563c9; border-color: #2f6fd6; }
      #fail button.primary:hover { background: #2a6ddb; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="booting" class="stack">
      <div class="spinner"></div>
      <h1 id="heading">Starting Calandria</h1>
      <div class="sub" id="subheading">Booting the local server and terminal sidecar…</div>
      <div class="slow">Still working — the first launch after an update takes longer.</div>
    </div>
    <div id="fail" class="stack" hidden>
      <h1 id="fail-title">Cannot reach this instance</h1>
      <div id="detail"></div>
      <div class="buttons">
        <button id="retry" type="button" class="primary">Retry</button>
        <button id="switch" type="button">Switch instance</button>
      </div>
    </div>
    <pre id="log"></pre>
  </body>
</html>
