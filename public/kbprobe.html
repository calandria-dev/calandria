<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Composer keyboard probe — round 4</title>
<style>
 :root{color-scheme:light dark}
 *{-webkit-tap-highlight-color:transparent}
 body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:18px 14px 40vh;max-width:640px}
 h1{font-size:18px;margin:0 0 10px}
 .why{background:#8881;border-radius:8px;padding:11px 13px;font-size:13.5px;margin:0 0 18px;color:#aaa}
 .word{display:inline-block;background:#3b82f6;color:#fff;border-radius:6px;padding:3px 9px;font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:15px}
 .comp-box{border:1px solid #8886;border-radius:12px;background:#8881;overflow:hidden}
 .comp-area{display:flex;align-items:flex-end;gap:10px;padding:11px 12px 11px 15px}
 .comp-area textarea{flex:1;border:none;background:none;resize:none;outline:none;font-size:16px;line-height:1.5;color:inherit;max-height:160px;min-height:22px;padding:8px 0}
 .send{width:40px;height:40px;flex:0 0 auto;border-radius:9px;background:#3b82f6;color:#fff;display:grid;place-items:center;border:0;font-size:17px}
 input.decoy{width:100%;box-sizing:border-box;font:16px/1.4 inherit;padding:10px;border:1px solid #8886;border-radius:8px;background:#8881;color:inherit;margin-bottom:14px}
 .ask{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:14px;flex-wrap:wrap}
 .ask b{font-weight:600;min-width:70px}
 button.tog{font:14px/1 inherit;padding:10px 16px;border-radius:999px;border:1px solid #8886;background:transparent;color:inherit}
 button.tog[aria-pressed=true]{background:#3b82f6;border-color:#3b82f6;color:#fff}
 .nav{margin-top:26px;display:flex;gap:10px;align-items:center}
 .nav a{flex:1;text-align:center;text-decoration:none;background:#3b82f6;color:#fff;padding:13px;border-radius:9px;font-weight:600}
 .nav a.ghost{background:#8882;color:inherit}
 .prog{font-size:12px;color:#888;margin-bottom:6px}
 pre{background:#111;color:#eee;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;word-break:break-word}
 .note{font-size:12.5px;color:#999;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Round 4. Rounds 1-3 established: the composer's ATTRIBUTES are clean (R),
// its one-line GEOMETRY is clean (X vs R), its PLACEHOLDER is clean (K/N/L),
// and the task title is irrelevant (a neutral-titled task reproduces the bug).
// The one structural difference left between the probe and the real screen is
// that every probe page carried 6-8 text fields, while the app's composer is
// the ONLY text field on screen. So each variant below renders exactly one
// page, with the field count as the variable.
var VARIANTS = [
  { id:'1', word:'occassion', title:'Variant 1 — a LONE composer, nothing else',
    why:'One text field on the page. Composer markup exactly as shipped. If the loneliness theory is right, THIS is the one that misbehaves.',
    decoy:false, bare:false, form:false },
  { id:'2', word:'priviledge', title:'Variant 2 — the same composer, plus one other field',
    why:'Byte-identical to variant 1 with a single extra text input above it. 1 vs 2 is the whole experiment: if 1 is dirty and 2 is clean, field count is the trigger.',
    decoy:true, bare:false, form:false },
  { id:'3', word:'recomend', title:'Variant 3 — a LONE bare textarea',
    why:'No attributes at all, still alone on the page. Separates "being alone" from "being alone with these attributes".',
    decoy:false, bare:true, form:false },
  { id:'4', word:'arguement', title:'Variant 4 — a LONE composer inside a real <form>',
    why:'The app has no <form> anywhere. If wrapping one in a form changes the verdict, that is a fix we can actually ship.',
    decoy:false, bare:false, form:true }
];

function load(){ try { return JSON.parse(localStorage.getItem('kb4')||'{}'); } catch(e){ return {}; } }
function save(d){ try { localStorage.setItem('kb4', JSON.stringify(d)); } catch(e){} }

var qs = (location.search.match(/[?&]v=([^&]*)/)||[])[1] || '1';
var app = document.getElementById('app');
var data = load();

if (qs === 'done') {
  var s = 'KBPROBE r4\n' + navigator.userAgent + '\ndisplay-mode: ' +
    (['standalone','fullscreen','minimal-ui','browser'].filter(function(x){return matchMedia('(display-mode: '+x+')').matches}).join(', ')||'?') +
    '   navigator.standalone: ' + (typeof navigator.standalone === 'undefined' ? 'n/a' : navigator.standalone) + '\n';
  VARIANTS.forEach(function(v){
    var r = data[v.id] || {};
    s += v.id + ' (' + v.word + ', ' + (v.decoy?'2 fields':'1 field') + (v.bare?', bare':'') + (v.form?', in form':'') + '): code=' + (r.code||'?') + ' corrects=' + (r.corr||'?') + '\n';
  });
  app.innerHTML = '<h1>Done — paste this back</h1><pre id="sum"></pre>' +
    '<div class="nav"><a href="#" id="copy">Copy results</a><a class="ghost" href="?v=1">Start over</a></div>' +
    '<div class="note">Each variant was its own page load, so nothing on one page could influence another.</div>';
  document.getElementById('sum').textContent = s;
  document.getElementById('copy').onclick = function(e){
    e.preventDefault();
    if (navigator.clipboard) navigator.clipboard.writeText(s).then(function(){ document.getElementById('copy').textContent = 'Copied ✓'; });
  };
} else {
  var i = VARIANTS.map(function(v){return v.id}).indexOf(qs);
  if (i < 0) i = 0;
  var v = VARIANTS[i];
  var next = (i + 1 < VARIANTS.length) ? ('?v=' + VARIANTS[i+1].id) : '?v=done';

  var field = v.bare
    ? '<textarea rows="1" placeholder="Reply to Claude…"></textarea>'
    : '<textarea rows="1" name="message" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" placeholder="Reply to Claude…"></textarea>';
  var box = '<div class="comp-box"><div class="comp-area">' + field + '<button class="send" type="button">↑</button></div></div>';
  if (v.form) box = '<form onsubmit="return false">' + box + '</form>';

  app.innerHTML =
    '<div class="prog">' + (i+1) + ' of ' + VARIANTS.length + '</div>' +
    '<h1>' + v.title + '</h1>' +
    '<div class="why">' + v.why + '</div>' +
    (v.decoy ? '<input class="decoy" type="text" placeholder="Search tasks">' : '') +
    box +
    '<div class="ask" id="a1"><b>code?</b></div>' +
    '<div class="ask" id="a2"><b>corrects?</b></div>' +
    '<div class="nav"><a href="' + next + '" id="next">Next →</a></div>' +
    '<div class="note">Tap the box. Chip above the keyboard? Then type <span class="word">' + v.word +
    '</span> and a space — corrected? Don’t undo it. Each variant is a separate page load with its own word.</div>';

  data[v.id] = data[v.id] || {code:'?', corr:'?'};
  [['code','a1'],['corr','a2']].forEach(function(pair){
    var row = document.getElementById(pair[1]);
    ['yes','no'].forEach(function(val){
      var b = document.createElement('button');
      b.className='tog'; b.type='button'; b.textContent=val;
      b.setAttribute('aria-pressed', data[v.id][pair[0]] === val ? 'true' : 'false');
      b.onclick = function(){
        data[v.id][pair[0]] = val; save(data);
        Array.prototype.forEach.call(row.querySelectorAll('button'), function(o){ o.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      };
      row.appendChild(b);
    });
  });
}
</script>
</body>
</html>
