# Keeps the two pinned supply-chain inputs from rotting.
#
# publish-image.yml/test.yml pin every action to a full commit SHA, and the
# Dockerfile pins its base image by digest. Both are immutable by design — and
# immutable means a published security fix never reaches this repo on its own.
# SHA pinning WITHOUT this file is strictly worse than tag pinning: `@v7` at
# least drifts onto patches. Dependabot is the half that makes the pin safe.
#
# It reads the `# v7.3.0` trailing comments in the workflows to know which
# release a SHA corresponds to, so keep those comments accurate when a pin is
# ever touched by hand.
#
# DELIBERATELY NOT COVERED:
#
# - npm VERSION updates, AT THE ROOT. The lockfile pins ~1k transitive
#   packages and a personal fork does not want that PR volume. See issue #17.
#   `/website` is the deliberate exception; its entry below says why.
#
#   Root npm SECURITY updates ARE covered when both dependency alerts and
#   Dependabot security updates are enabled:
#   `gh api --method PUT repos/calandria-dev/calandria/vulnerability-alerts`
#   and `gh api --method PUT repos/calandria-dev/calandria/automated-security-fixes`.
#   That is a different mechanism from the version updates this file
#   configures, and it needs no entry here. It opens a PR only when a
#   published advisory matches something already in the lockfile, so its
#   volume is the advisory rate for this tree: zero PRs between the 0.11.0
#   release and 2026-09-09, then one. The volume argument above is why root
#   version updates stay off; it does not reach this.
#
#   Both settings were verified enabled on 2026-09-11 after this audit found
#   them disabled while the prior note said they were enabled.
#
#   Three advisories against `next`, `sharp` and `hono` published overnight and
#   turned `Audit (npm)` red on every open PR at once,
#   blocking work whose diffs did not touch a lockfile until a human bumped
#   the deps by hand (issue #286, fixed by PR #289). The `audit` job found
#   them correctly. What was missing was a PR that fixes them.
#
#   `npm audit` remains the gate, and now covers what security updates miss or
#   have not opened a PR for yet: `npm audit --package-lock-only --omit=dev
#   --audit-level=high`, in the `audit` job in test.yml on every push and PR,
#   plus the weekly unattended run in security-scan.yml. It also still catches
#   MODERATE and below, which security updates raise a PR for but the job's
#   --audit-level does not fail on.
#
#   MANUAL STEP, ONE COMMAND, on any Dependabot PR that touches the root
#   lockfile: npm strips `"gypfile": false` from the
#   `node_modules/better-sqlite3` entry every time it regenerates
#   package-lock.json, so every such PR needs that field re-added before it
#   can go green. On the PR branch, run `npm run fix-lockfile` and commit the
#   one-line change; `npm run fix-lockfile -- --check` reports without
#   writing. The script is `scripts/fix-lockfile-gypfile.mjs`, and its
#   detection mirrors the test below, so a future package with the same shape
#   is repaired by the same command.
#   The `Windows (types + unit)` job runs `npm ci` before any test, and a
#   missing field fails the install itself with `gyp ERR! find VS`, so no
#   test-side repair and no root `postinstall` runs early enough to prevent
#   it; only a committed lockfile edit does.
#   `tests/lockfileGypfile.test.ts` reports the omission on Linux, where `npm
#   ci` exits 0 and only Windows would have failed. Its header comment has
#   the full mechanism.
#
#   NOT AUTOMATED, decided 2026-09-09. A bot that re-adds the field on a
#   Dependabot PR has to push to that PR's branch, and the push has to re-run
#   the check it is fixing. A push made with GITHUB_TOKEN triggers no
#   workflow run, so `Windows (types + unit)` would sit at its old red result
#   and a human would rerun it by hand, which is the step the automation was
#   supposed to remove. Making the push retrigger CI needs a repo-scoped PAT
#   held as a secret and exposed to a `pull_request_target` job that runs
#   against a branch a bot writes. That is a standing repo-write credential
#   on an automated code path, bought for roughly one PR per advisory (zero
#   between the 0.11.0 release and 2026-09-09, then one), on a PR a human
#   reviews and merges either way. The one-command script above collects the
#   part of the value that does not need the credential.
#
#   RETIRED WHEN npm SHIPS THE FIX. npm/cli#9837 tracks this exact defect and
#   npm/cli#9859 is the fix, open and unmerged as of 2026-09-09. arborist's
#   `shrinkwrap.js` still omits `gypfile` from the fields it copies into a
#   lock entry, and `rebuild.js` still schedules `node-gyp rebuild` when the
#   field reads undefined. Confirmed against npm 10.9.3 on 2026-09-09: a
#   fresh `npm install better-sqlite3@13.0.3` writes no `gypfile` into the
#   lockfile it generates. better-sqlite3 13.0.3 still ships `binding.gyp`
#   alongside its prebuilds and declares no install script, so nothing on
#   that side retires it either. Once npm/cli#9859 is in a released npm that
#   both this repo and Dependabot run, delete the script, this note and
#   `tests/lockfileGypfile.test.ts` together.
#
# - The agent CLI versions (CLAUDE_CODE_VERSION / CODEX_VERSION ARGs in the
#   Dockerfile), bumped deliberately by hand — see the comment there.
# - The build engine (buildx + BuildKit) in publish-image.yml. Dependabot's
#   docker ecosystem reads Dockerfiles, Compose files and k8s manifests, and
#   its github-actions ecosystem reads `uses:` refs. Neither reads a
#   `driver-opts: image=moby/buildkit:...` string inside a workflow
#   (dependabot-core#5541, #5819, #6892). publish-image.yml therefore leaves
#   the engine on Docker's `buildx-stable-1` channel; its header explains the
#   full reasoning and the two mitigations that replace the pin.
#
# RENOVATE: PROTOTYPED AND DECLINED. Do not re-open on the tooling argument
# alone — that argument is now spent.
#
# Renovate's regex customManagers CAN see what Dependabot cannot, so "no bot
# could bump it" is NOT why the engine is unpinned. A working prototype was
# built and run against this repo (`renovate --platform=local`): two custom
# managers extracted all four invisible pins — the moby/buildkit tag+digest in
# `driver-opts`, a `version:` input on setup-buildx-action, and both Dockerfile
# ARGs — and proposed correct bumps with correctly scoped replace anchors.
# `enabledManagers: ["custom.regex"]` disabled every native manager, so a
# scoped Renovate provably would NOT duplicate this file's action/FROM PRs.
# It works. It is still not worth it, for three reasons:
#
#   1. It trades a loud limitation for a silent one. Verified in the prototype:
#      give the image an explicit registry prefix (a `docker.io/` in front of
#      `moby/buildkit`) and the regex stops matching, the dependency vanishes
#      from the run, and Renovate reports NO warning — the other deps still
#      resolve, so even the debug-level "enabled but found no results" hint
#      never fires.
#      That lands on exactly the unbotted digest pin this file exists to
#      prevent, except the config still looks healthy. Renovate has no "fail if
#      matchStrings matched nothing" option, so catching it needs a CI
#      assertion on the extracted dependency count — a test whose only job is
#      keeping the bot honest. (Config upkeep is not free either: fileMatch ->
#      managerFilePatterns was already one breaking migration.)
#   2. The Dockerfile ARGs are a trap, not a bonus. CODEX_VERSION has to move
#      in step with @openai/codex-sdk in package-lock.json, and root npm
#      version updates are excluded above, so Renovate would open CLI bumps
#      that are unsafe to merge as written.
#      @anthropic-ai/claude-code ships ~21 stable releases a month, so
#      that PR would be rewritten several times a week. Both ARGs are bumped by
#      hand BECAUSE the upgrade is a behavioural decision, not because no bot
#      could see them.
#      Hand-bumped must not mean unwatched, which it was: CODEX_VERSION sat
#      seven minors back at 0.146.0 until GPT-6 Astra failed on it outright.
#      Both halves a bot would have given us are now covered without one.
#      `Pin drift` (.github/workflows/pin-drift.yml) files an issue when either
#      ARG goes three weeks old or three minors behind — a notice, not a PR,
#      because the merge needs a human to exercise the agent either way. And
#      the step-in-with-the-SDK constraint is `tests/cliPins.test.ts`, which
#      fails on the PR that desynchronizes them; a Renovate PR touching only
#      the ARG could not have satisfied it.
#      AGY_VERSION is the exception, and it is the one case where "a bot should
#      open the PR" was right. The vendor's manifest carries the version AND
#      the SHA-512, so the bump is three values copied out of two JSON
#      documents with nothing to judge, and the Dockerfile's own guard rejects
#      any pair that is not what upstream serves. `Pin drift` owns those three
#      ARGs outright: it force-pushes `bot/agy-pin` and opens one pull request
#      per version, dispatches both architecture image builds against that
#      branch to check the digests it wrote, and never automerges. That is
#      forty lines in this repo running on `GITHUB_TOKEN`, with no standing PAT
#      and no third-party app holding write access.
#   3. The coverage bought is one image that is already recorded (versions plus
#      resolved digest, to the run summary), floored (hard-fails below the
#      type=gha minimums), and removed outright from the merge job.
#
# The strongest argument FOR pinning, recorded so it is not lost: a digest pin
# would buy temporal trust the pinned action SHA does not already cover. The
# BuildKit image and docker/setup-buildx-action are separate late-bound
# artifacts, so a registry-side tag retarget moves the engine without touching
# the action SHA. That gain is real. It is outweighed here because collecting
# it needs a second bot whose failure mode is silence, plus either prompt
# manual merges (which reintroduce the staleness the pin was meant to remove)
# or automerge (which removes the human gate the pin was meant to add).
#
# Re-open only if: Renovate is adopted for repo-wide coverage anyway — in which
# case it takes EVERYTHING except the three agy ARGs, which `Pin drift` owns and
# must be excluded from any regex manager, since one pin must have exactly one
# owner and two bots on the same SHA is the real failure mode;
# deterministic builder identity becomes a compliance requirement; or
# `buildx-stable-1` actually causes an incident.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" means .github/workflows/, not the repo root, for this ecosystem.
    directory: /
    schedule:
      interval: weekly
    # One PR for the batch. Actions move together and each is a one-line SHA
    # swap; seven separate PRs for a weekly bump is how this gets muted.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: [dependencies]

  # The one npm ecosystem this file DOES cover with version updates, and the
  # exception is narrow on purpose. The root exclusion above is about the PR
  # volume of a ~1k-package lockfile, which does not apply here. website/ is
  # the calandria.dev Astro site (design plan in the private notes repo at
  # design/WEBSITE.md) with a single direct
  # dependency and ~190 transitive ones, and NOTHING else watches it — the
  # `audit` job in test.yml and the weekly one in security-scan.yml both run
  # against the root lockfile only, and test.yml now ignores website/** outright.
  # Grouped into one PR so the site can never contribute more than a single
  # weekly item to the queue.
  #
  # Repo-level security updates cover this directory too, so an advisory
  # against a website dependency can open a security PR of its own alongside
  # the weekly group PR. That overlap is accepted and this entry stays. The
  # duplicate is capped at one extra PR per advisory, and whichever of the two
  # is rebased second finds the bump already applied and gets closed. Dropping
  # the version entry to avoid the overlap would leave the only tree with no
  # audit gate behind it on advisory-only coverage, which is the thing this
  # entry exists to prevent.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # node:22-bookworm-slim is pinned tag@digest; Dependabot rewrites the digest
    # (and the tag, if the 22.x line moves) in both FROM lines.
    groups:
      base-image:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: [dependencies]
