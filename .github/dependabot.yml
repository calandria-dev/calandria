# Keeps the two pinned supply-chain inputs from rotting.
#
# publish-image.yml/test.yml pin every action to a full commit SHA, and the
# Dockerfile pins its base image by digest. Both are immutable by design — and
# immutable means a published security fix never reaches this repo on its own.
# SHA pinning WITHOUT this file is strictly worse than tag pinning: `@v7` at
# least drifts onto patches. Dependabot is the half that makes the pin safe.
#
# It reads the `# v7.3.0` trailing comments in the workflows to know which
# release a SHA corresponds to, so keep those comments accurate when a pin is
# ever touched by hand.
#
# DELIBERATELY NOT COVERED:
#
# - npm. The lockfile pins ~1k transitive packages and a personal fork does not
#   want that PR volume; `npm audit` covers the security case.
# - The agent CLI versions (CLAUDE_CODE_VERSION / CODEX_VERSION ARGs in the
#   Dockerfile), bumped deliberately by hand — see the comment there.
# - The build engine (buildx + BuildKit) in publish-image.yml. This one is not
#   a choice so much as a limit: Dependabot's docker ecosystem reads
#   Dockerfiles, Compose files and k8s manifests, and its github-actions
#   ecosystem reads `uses:` refs. Neither reads a `driver-opts:
#   image=moby/buildkit:...` string inside a workflow (dependabot-core#5541,
#   #5819, #6892). So the engine CANNOT be pinned here without creating exactly
#   the unbotted SHA pin this file exists to prevent, and publish-image.yml
#   deliberately leaves it on Docker's `buildx-stable-1` channel instead. Its
#   header explains the full reasoning and the two mitigations that replace the
#   pin. If a bot for it is ever wanted, that means adopting Renovate (it has
#   custom managers that can match arbitrary workflow strings) — a second bot
#   is the real cost of pinning the engine, and it is why we don't.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" means .github/workflows/, not the repo root, for this ecosystem.
    directory: /
    schedule:
      interval: weekly
    # One PR for the batch. Actions move together and each is a one-line SHA
    # swap; seven separate PRs for a weekly bump is how this gets muted.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # node:22-bookworm-slim is pinned tag@digest; Dependabot rewrites the digest
    # (and the tag, if the 22.x line moves) in both FROM lines.
    groups:
      base-image:
        patterns: ["*"]
    commit-message:
      prefix: "build"
    labels: [dependencies]
