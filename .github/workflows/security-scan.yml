# Weekly, unattended dependency and image CVE scanning (issue #17). Neither
# job is gated on a code push — both exist to catch an advisory that lands
# against code that hasn't changed, which push-triggered CI by definition
# can't see.
#
#   npm-audit   — same command as the `audit` job in test.yml (must not
#                 drift — test.yml's job comment says so explicitly), repeated
#                 on a schedule so a fresh advisory is caught between pushes.
#                 Its display name carries a ", weekly" suffix so the two are
#                 distinguishable as status checks; see the job.
#   image-scan  — trivy scan of the published :edge image, failing on
#                 fixable HIGH/CRITICAL findings. Nothing else in the
#                 pipeline scans the built artifact.
#
# Failure notification is email-to-actor (GitHub's default for a scheduled
# workflow) for now; wiring a red run into #11's failure-monitoring
# automation is deferred, not forgotten.
name: Security scan

on:
  schedule:
    # Monday 06:00 UTC — quiet, and clear of the weekly Dependabot runs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    # NOT "Audit (npm)". That is test.yml's job, and a job name is what a
    # required status check, a branch-protection rule and `gh run` all address a
    # check by. Two workflows answering to one name is ambiguous even now, when
    # they cannot run on the same commit — this one is schedule- and
    # dispatch-only — because requiring "Audit (npm)" would silently be
    # satisfiable by whichever of the two reported. The suffix says which lane
    # it is rather than which command it runs; the command is the same one.
    name: Audit (npm, weekly)
    runs-on: ubuntu-24.04
    # See test.yml's `audit` job: no install happens here, so 5 minutes is
    # ample for the audit call itself.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache: npm` — no `npm ci` runs here for it to speed up.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # --package-lock-only: the advisory set is keyed off the lockfile
      # against the registry, not off an installed tree, so there's no need
      # to `npm ci` first. See test.yml's `audit` job for the measurement.
      - run: npm audit --package-lock-only --omit=dev --audit-level=high

  image-scan:
    name: Image scan (trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # `edge` is what main builds move (issue #12 flipped `latest` to track
          # releases only) — scanning `latest` here would freeze the scan on the
          # last release instead of guarding what CI currently produces.
          image-ref: ghcr.io/calandria-dev/calandria:edge
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Upstream-blocked CVEs we can't patch directly (issue #21) —
          # see .trivyignore's header for the revisit policy.
          trivyignores: .trivyignore
