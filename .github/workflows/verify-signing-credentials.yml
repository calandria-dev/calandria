# Does the signing identity actually work?
#
# Not "are the secrets set" — GitHub can answer that. This answers the question
# the secret names cannot: whether the certificate imports, whether its chain
# validates, whether the identity string matches what the build will ask for,
# and whether the notarization credentials authenticate with enough privilege.
# Every one of those failures produces a secret that looks perfectly correct and
# breaks at the end of a long release build (desktop/README.md, "Signing and
# publishing", lists them). This is two minutes on a hosted runner instead.
#
# MANUAL ONLY, AND THAT IS THE SECURITY BOUNDARY. This is the one workflow in the
# repo that hands the real Developer ID certificate to a runner. `pull_request`
# would expose it to anything a contributor could get merged into a branch;
# `push` would run it on every commit for no reason. workflow_dispatch can only
# be started by someone with write access, so the certificate never leaves the
# maintainer's own hands. Do not add another trigger. The Windows job stores no
# certificate at all, but the same trigger keeps it from spending a signature on
# every push.
#
# The macOS job only reads. The Windows job signs one throwaway file, because
# reading is not available there: the Azure variables are not secrets, so
# presence is already visible in `gh variable list` and the release lane already
# gates on it, while the federated credential, the role assignment and the
# certificate profile stay invisible until something asks the service to sign.
# Neither job notarizes, publishes or uploads anything.
name: Verify signing credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Developer ID and notarization credentials
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CALANDRIA_MAC_SIGN_IDENTITY: ${{ secrets.CALANDRIA_MAC_SIGN_IDENTITY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      # Named one at a time rather than as a single "secrets missing" failure,
      # because the whole point is to say which one.
      - name: Check every secret is present
        run: |
          set -euo pipefail
          missing=()
          for name in CALANDRIA_MAC_SIGN_IDENTITY CSC_LINK CSC_KEY_PASSWORD \
                      APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::not set: ${missing[*]}. See desktop/README.md 'Signing and publishing'."
            exit 1
          fi
          echo "all six are set"

      # THE CHAIN CHECK, and the reason this job exists at all. `-v` on
      # find-identity means VALID: an identity whose chain cannot be built to a
      # trusted root is simply not listed. So a .p12 carrying only the leaf — no
      # Developer ID G1/G2 intermediate — imports without complaint here and
      # produces nothing, which is exactly what it would do mid-release.
      #
      # A note on reading the output: CALANDRIA_MAC_SIGN_IDENTITY is a secret, so
      # GitHub masks it as *** wherever it appears. The identity line will look
      # redacted. That is expected; the grep below is what actually decides.
      - name: Import the certificate and look for the identity
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/verify-signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          # `base64 --decode` on a value that is not base64 fails loudly, which
          # is the right answer: CSC_LINK must be the bare string, and a
          # PEM-wrapped `certutil -encode` blob is a documented wrong turn.
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12" || {
            echo "::error::CSC_LINK is not valid base64. It must be the bare base64 of the .p12, with no PEM header or line breaks — see desktop/README.md 'Signing and publishing'."
            exit 1
          }

          # A failure here is usually OpenSSL 3's default PKCS#12 encryption,
          # which `security import` cannot read. -legacy on export is the fix.
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security || {
            echo "::error::security import failed. Either CSC_KEY_PASSWORD is wrong, or the .p12 was exported with OpenSSL 3's default encryption — re-export with -legacy (desktop/README.md 'Signing and publishing')."
            exit 1
          }

          echo "--- valid codesigning identities in the imported keychain ---"
          security find-identity -v -p codesigning "$keychain" || true

          if ! security find-identity -v -p codesigning "$keychain" \
               | grep -qF "$CALANDRIA_MAC_SIGN_IDENTITY"; then
            echo "::error::No VALID identity matches CALANDRIA_MAC_SIGN_IDENTITY. Either the string does not match the certificate's CN exactly (openssl x509 -noout -subject), or the .p12 is missing the Developer ID intermediate, which makes the identity import but never validate. desktop/README.md 'Signing and publishing'."
            exit 1
          fi
          echo "the certificate imports, its chain validates, and the identity string matches"

      # notarytool's cheapest authenticated call. It submits nothing and consumes
      # none of Apple's ~75/day submission budget; an empty history on a fresh
      # account is a pass. This is also the only way to settle the one thing
      # §6.4 could not confirm from Apple's own prose — whether the key's role is
      # sufficient to notarize. An authorization failure here means it is not:
      # regenerate the key as App Manager or Admin.
      - name: Check the notarization credentials authenticate
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"

          # Accept the .p8 either base64-encoded (what §6.4 asks for) or pasted
          # raw. Both are easy to do and only one is documented; failing someone
          # for guessing the other way would be a false alarm about the thing
          # this job exists to test.
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "note: APPLE_API_KEY_P8 holds the raw .p8; base64 is what §6.4 documents, but this works"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key" || {
              echo "::error::APPLE_API_KEY_P8 is neither valid base64 nor a raw .p8. It should be the CONTENTS of AuthKey_<KEYID>.p8."
              exit 1
            }
          fi
          chmod 600 "$key"

          if ! xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"; then
            echo "::error::notarytool could not authenticate. Three usual causes, in order of likelihood: the key is an INDIVIDUAL key rather than a TEAM key (Apple bars individual keys from notaryTool outright), APPLE_API_ISSUER is not the UUID from the top of the Team Keys page, or the key's role is too low — regenerate as App Manager or Admin. desktop/README.md 'Signing and publishing'."
            exit 1
          fi
          echo "the notarization credentials authenticate and the role is sufficient"

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/verify-signing.keychain-db" 2>/dev/null || true

      - name: Summary
        run: |
          {
            echo "### macOS signing credentials verified"
            echo
            echo "- Certificate imports, chain validates, identity matches \`CALANDRIA_MAC_SIGN_IDENTITY\`"
            echo "- Notarization credentials authenticate with sufficient privilege"
            echo
            echo "This does not prove an artifact will pass Gatekeeper — only a real"
            echo "signed, notarized, stapled build downloaded through a browser does that."
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows Artifact Signing credential
    runs-on: windows-latest
    timeout-minutes: 20
    # A federated credential matches ONE exact subject string, and GitHub derives
    # that string from the run's ref unless the job names an environment.
    # release-desktop.yml signs on `v*` tag pushes, so a ref-scoped credential
    # would need a new entry for every release. Naming an environment fixes the
    # subject at `repo:<owner>/<repo>:environment:windows-signing` for every ref,
    # which is why the release lane's build job names the same one. The
    # environment carries no protection rules and holds no secrets; it exists to
    # make the OIDC subject constant.
    environment: windows-signing
    permissions:
      contents: read
      # This token is the credential. There is no certificate and no secret on
      # the Windows side; azure/login exchanges it for an Entra ID token.
      id-token: write
    env:
      AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
      AZURE_CODE_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_CODE_SIGNING_CERT_PROFILE_NAME }}
      AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
    steps:
      # Named one at a time, like the macOS job above, and for the same reason.
      # These are repository VARIABLES rather than secrets: none of them is a
      # credential, so the values print in full and `gh variable list` shows
      # them.
      - name: Check every variable is present
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'AZURE_CODE_SIGNING_ENDPOINT',
            'AZURE_CODE_SIGNING_ACCOUNT_NAME',
            'AZURE_CODE_SIGNING_CERT_PROFILE_NAME',
            'AZURE_CODE_SIGNING_PUBLISHER_NAME',
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID'
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            Write-Output "::error::not set: $($missing -join ', '). These are repository variables, not secrets. See desktop/README.md 'Signing and publishing'."
            exit 1
          }
          # The release lane's gate leaves this one out, and azure/login is given
          # allow-no-subscriptions, so an empty value still authenticates.
          if (-not $env:AZURE_SUBSCRIPTION_ID) {
            Write-Output "::notice::AZURE_SUBSCRIPTION_ID is not set. azure/login runs with allow-no-subscriptions and signing needs no subscription context, so this is tolerated."
          }
          Write-Output "all six required variables are set"

      # The same action and the same pin as release-desktop.yml. A failure here
      # is the federated credential: either no credential on the app registration
      # matches this run's subject, or AZURE_CLIENT_ID and AZURE_TENANT_ID name
      # the wrong application or the wrong directory.
      - name: Authenticate to Azure
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      # Copied from app-builder-lib's WindowsSignAzureManager.initialize(), so a
      # module that stops installing fails in two minutes here rather than forty
      # minutes into a release. The NuGet provider install is allowed to fail in
      # both places: hosted runners already have it, and Install-Module reports
      # the real problem when they do not.
      - name: Install the signing module the release lane installs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          } catch {
            Write-Output "note: Install-PackageProvider NuGet failed ($($_.Exception.Message)); continuing, as electron-builder does"
          }
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser
          Get-Module -ListAvailable -Name TrustedSigning | Format-Table Name, Version

      # Authenticode signs a PE file, so the probe has to be one, and a compiled
      # assembly is the cheapest one a runner produces without the Windows SDK.
      # Windows PowerShell rather than pwsh: -OutputAssembly is only reliably
      # available there.
      - name: Build a throwaway binary to sign
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition 'public class SigningProbe { }' `
            -OutputAssembly "$env:RUNNER_TEMP\signing-probe.dll" -OutputType Library
          if (-not (Test-Path "$env:RUNNER_TEMP\signing-probe.dll")) {
            throw "the probe assembly was not written"
          }

      # The call the release lane makes, parameter for parameter, including the
      # timestamp and digest defaults app-builder-lib fills in when the config
      # omits them. Nothing authenticates explicitly: the module uses
      # Azure.Identity's ambient chain, which reads what azure/login left behind,
      # so a failure here is the same failure a release would hit. Reaching this
      # step means the token was minted; failing it means the app registration
      # lacks the signer role on the certificate profile, or the endpoint,
      # account or profile name is wrong.
      #
      # It spends one signature against the account's monthly allowance.
      - name: Sign it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-TrustedSigning `
            -Endpoint $env:AZURE_CODE_SIGNING_ENDPOINT `
            -CodeSigningAccountName $env:AZURE_CODE_SIGNING_ACCOUNT_NAME `
            -CertificateProfileName $env:AZURE_CODE_SIGNING_CERT_PROFILE_NAME `
            -TimestampRfc3161 'http://timestamp.acs.microsoft.com' `
            -TimestampDigest SHA256 `
            -FileDigest SHA256 `
            -Files "$env:RUNNER_TEMP\signing-probe.dll"

      - name: Check the signature verifies and names the right publisher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = "$env:RUNNER_TEMP\signing-probe.dll"
          $sig = Get-AuthenticodeSignature -LiteralPath $probe

          Write-Output "status:      $($sig.Status)"
          Write-Output "subject:     $($sig.SignerCertificate.Subject)"
          Write-Output "issuer:      $($sig.SignerCertificate.Issuer)"
          Write-Output "valid until: $($sig.SignerCertificate.NotAfter)"

          if ($sig.Status -ne 'Valid') {
            Write-Output "::error::The file was signed but Get-AuthenticodeSignature reports $($sig.Status). Windows will not accept this signature, and electron-updater runs this exact call before installing an update."
            exit 1
          }

          # electron-builder copies AZURE_CODE_SIGNING_PUBLISHER_NAME into the
          # published latest.yml, and electron-updater refuses to install an
          # update whose installer does not match it. A wrong value ships a green
          # release that can never update itself, and the failure appears months
          # later on other people's machines.
          #
          # The comparison is electron-updater's own
          # (windowsExecutableCodeSignatureVerifier): when the configured value
          # parses as a distinguished name, every attribute in it must match the
          # certificate; when it is a bare name, it must equal the common name.
          function Get-DnMap([string] $value) {
            $map = @{}
            foreach ($part in ($value -split '(?<!\\),')) {
              $pair = $part -split '=', 2
              if ($pair.Count -eq 2) { $map[$pair[0].Trim()] = $pair[1].Trim() }
            }
            return $map
          }

          $configured = Get-DnMap $env:AZURE_CODE_SIGNING_PUBLISHER_NAME
          $subject = Get-DnMap $sig.SignerCertificate.Subject
          $matched = $true
          if ($configured.Count -gt 0) {
            foreach ($key in $configured.Keys) {
              if ($subject[$key] -ne $configured[$key]) { $matched = $false }
            }
          } else {
            $matched = $env:AZURE_CODE_SIGNING_PUBLISHER_NAME -eq $subject['CN']
          }

          if (-not $matched) {
            Write-Output "::error::AZURE_CODE_SIGNING_PUBLISHER_NAME is '$env:AZURE_CODE_SIGNING_PUBLISHER_NAME', which does not match the certificate. Set it to the subject printed above, verbatim. electron-updater compares the two before installing an update, so a mismatch publishes a release that can never update itself."
            exit 1
          }
          Write-Output "the signature verifies and AZURE_CODE_SIGNING_PUBLISHER_NAME matches the certificate"

      # A certificate profile issues certificates that live about three days, so
      # an untimestamped signature stops verifying within the week on machines
      # that already downloaded the installer. Get-AuthenticodeSignature does not
      # report an RFC 3161 countersignature at all, so this reads signtool
      # instead, which also runs the chain check Windows itself runs.
      - name: Check the signature is timestamped
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1

          if ($null -eq $signtool) {
            Write-Output "::notice::signtool.exe is not on this runner image, so the timestamp was not checked. Every other assertion in this job still ran."
            exit 0
          }

          $output = & $signtool.FullName verify /pa /v "$env:RUNNER_TEMP\signing-probe.dll" 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::signtool refused the signature. Windows applies the same policy to the NSIS installer a release publishes."
            exit 1
          }
          if ($output -notmatch '(?i)timestamp') {
            Write-Output "::error::signtool accepted the signature but reports no timestamp. Azure's timestamp service did not countersign, and the signature will stop verifying when the short-lived certificate expires days from now."
            exit 1
          }

      - name: Clean up
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP\signing-probe.dll" -ErrorAction SilentlyContinue

      - name: Summary
        shell: pwsh
        run: |
          @(
            "### Windows Artifact Signing credential verified",
            "",
            "- The federated credential authenticates and the app registration can sign with the certificate profile",
            "- The signature verifies against Windows' own policy and carries an RFC 3161 timestamp",
            "- ``AZURE_CODE_SIGNING_PUBLISHER_NAME`` matches the certificate, so electron-updater will accept a published installer",
            "",
            "This does not prove SmartScreen is quiet. Reputation accrues through",
            "download volume and only a real download shows what a user sees."
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
