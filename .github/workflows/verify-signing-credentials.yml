# Does the signing identity actually work?
#
# Not "are the secrets set" — GitHub can answer that. This answers the question
# the secret names cannot: whether the certificate imports, whether its chain
# validates, whether the identity string matches what the build will ask for,
# and whether the notarization credentials authenticate with enough privilege.
# Every one of those failures produces a secret that looks perfectly correct and
# breaks at the end of a long release build (docs/DESKTOP_APP.md §6.4 lists
# them). This is two minutes on a macOS runner instead.
#
# MANUAL ONLY, AND THAT IS THE SECURITY BOUNDARY. This is the one workflow in the
# repo that hands the real Developer ID certificate to a runner. `pull_request`
# would expose it to anything a contributor could get merged into a branch;
# `push` would run it on every commit for no reason. workflow_dispatch can only
# be started by someone with write access, so the certificate never leaves the
# maintainer's own hands. Do not add another trigger.
#
# Nothing here signs, notarizes or uploads anything. It reads.
name: Verify signing credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Developer ID and notarization credentials
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CALANDRIA_MAC_SIGN_IDENTITY: ${{ secrets.CALANDRIA_MAC_SIGN_IDENTITY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      # Named one at a time rather than as a single "secrets missing" failure,
      # because the whole point is to say which one.
      - name: Check every secret is present
        run: |
          set -euo pipefail
          missing=()
          for name in CALANDRIA_MAC_SIGN_IDENTITY CSC_LINK CSC_KEY_PASSWORD \
                      APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::not set: ${missing[*]}. See docs/DESKTOP_APP.md §6.4."
            exit 1
          fi
          echo "all six are set"

      # THE CHAIN CHECK, and the reason this job exists at all. `-v` on
      # find-identity means VALID: an identity whose chain cannot be built to a
      # trusted root is simply not listed. So a .p12 carrying only the leaf — no
      # Developer ID G1/G2 intermediate — imports without complaint here and
      # produces nothing, which is exactly what it would do mid-release.
      #
      # A note on reading the output: CALANDRIA_MAC_SIGN_IDENTITY is a secret, so
      # GitHub masks it as *** wherever it appears. The identity line will look
      # redacted. That is expected; the grep below is what actually decides.
      - name: Import the certificate and look for the identity
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/verify-signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          # `base64 --decode` on a value that is not base64 fails loudly, which
          # is the right answer: CSC_LINK must be the bare string, and a
          # PEM-wrapped `certutil -encode` blob is a documented wrong turn.
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12" || {
            echo "::error::CSC_LINK is not valid base64. It must be the bare base64 of the .p12, with no PEM header or line breaks — see docs/DESKTOP_APP.md §6.4."
            exit 1
          }

          # A failure here is usually OpenSSL 3's default PKCS#12 encryption,
          # which `security import` cannot read. -legacy on export is the fix.
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security || {
            echo "::error::security import failed. Either CSC_KEY_PASSWORD is wrong, or the .p12 was exported with OpenSSL 3's default encryption — re-export with -legacy (docs/DESKTOP_APP.md §6.4)."
            exit 1
          }

          echo "--- valid codesigning identities in the imported keychain ---"
          security find-identity -v -p codesigning "$keychain" || true

          if ! security find-identity -v -p codesigning "$keychain" \
               | grep -qF "$CALANDRIA_MAC_SIGN_IDENTITY"; then
            echo "::error::No VALID identity matches CALANDRIA_MAC_SIGN_IDENTITY. Either the string does not match the certificate's CN exactly (openssl x509 -noout -subject), or the .p12 is missing the Developer ID intermediate, which makes the identity import but never validate. docs/DESKTOP_APP.md §6.4."
            exit 1
          fi
          echo "the certificate imports, its chain validates, and the identity string matches"

      # notarytool's cheapest authenticated call. It submits nothing and consumes
      # none of Apple's ~75/day submission budget; an empty history on a fresh
      # account is a pass. This is also the only way to settle the one thing
      # §6.4 could not confirm from Apple's own prose — whether the key's role is
      # sufficient to notarize. An authorization failure here means it is not:
      # regenerate the key as App Manager or Admin.
      - name: Check the notarization credentials authenticate
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"

          # Accept the .p8 either base64-encoded (what §6.4 asks for) or pasted
          # raw. Both are easy to do and only one is documented; failing someone
          # for guessing the other way would be a false alarm about the thing
          # this job exists to test.
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "note: APPLE_API_KEY_P8 holds the raw .p8; base64 is what §6.4 documents, but this works"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key" || {
              echo "::error::APPLE_API_KEY_P8 is neither valid base64 nor a raw .p8. It should be the CONTENTS of AuthKey_<KEYID>.p8."
              exit 1
            }
          fi
          chmod 600 "$key"

          if ! xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"; then
            echo "::error::notarytool could not authenticate. Three usual causes, in order of likelihood: the key is an INDIVIDUAL key rather than a TEAM key (Apple bars individual keys from notaryTool outright), APPLE_API_ISSUER is not the UUID from the top of the Team Keys page, or the key's role is too low — regenerate as App Manager or Admin. docs/DESKTOP_APP.md §6.4."
            exit 1
          fi
          echo "the notarization credentials authenticate and the role is sufficient"

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/verify-signing.keychain-db" 2>/dev/null || true

      - name: Summary
        run: |
          {
            echo "### macOS signing credentials verified"
            echo
            echo "- Certificate imports, chain validates, identity matches \`CALANDRIA_MAC_SIGN_IDENTITY\`"
            echo "- Notarization credentials authenticate with sufficient privilege"
            echo
            echo "This does not prove an artifact will pass Gatekeeper — only a real"
            echo "signed, notarized, stapled build downloaded through a browser does that."
          } >> "$GITHUB_STEP_SUMMARY"
