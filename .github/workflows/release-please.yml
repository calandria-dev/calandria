# Opens/updates a release PR from Conventional Commits on every push to main,
# and — once that PR is merged — cuts the GitHub Release and the `vX.Y.Z` tag.
# See issue #12 for the decision record: release-please over manual
# `gh release create`, semver 0.x while pre-1.0 (bump-minor-pre-major in
# release-please-config.json keeps a breaking change on the 0.x line instead
# of jumping to 1.0.0), and `latest` tracking the newest release rather than
# main (publish-image.yml).
#
# This runs with RELEASE_PLEASE_TOKEN, a fine-grained PAT (contents +
# pull-requests read/write, scoped to this repo) provisioned by the user and
# stored as an Actions secret. GITHUB_TOKEN would hit GitHub's recursion
# prevention twice: the release PR wouldn't get test.yml `pull_request` runs,
# and — worse — the `vX.Y.Z` tag pushed on PR merge wouldn't fire
# publish-image.yml's `push: tags:` trigger, leaving every release needing a
# manual `gh workflow run publish-image.yml --ref vX.Y.Z`. With the PAT both
# fire normally. If the secret ever lapses (fine-grained PATs expire ≤1 year),
# the action falls back to GITHUB_TOKEN and releases degrade to that manual
# dispatch — nothing breaks, it just gets slower. Agents may maintain this
# wiring; they do not provision tokens (see .github/CLAUDE.md).
#
# TAG FORMAT is load-bearing, not cosmetic: publish-image.yml triggers on
# `push: tags: ["v*"]` and derives its image tags with
# `type=semver,pattern={{version}}`. Both need the tag to be exactly `vX.Y.Z`.
# release-please's `include-component-in-tag` DEFAULTS TO TRUE, and in manifest
# mode the node strategy takes the component from package.json's `name` — so
# the default here is `calandria-v0.2.0`, which matches neither `v*` nor
# semver. The first release PR was generated that way (its changelog compared
# `calandria-v0.1.0...calandria-v0.2.0`); merging it as-is would have cut a tag
# that fired no publish at all, and even a manual dispatch on that ref would
# have produced no `latest`/`X.Y.Z`/`X.Y` tags. Hence
# `"include-component-in-tag": false` in release-please-config.json. There is
# one package at the repo root, so the component name buys nothing to begin
# with. If a second package is ever added, that flag has to be reconsidered
# together with publish-image.yml's trigger — they are one decision.
name: release-please

on:
  push:
    branches: [main]
  # The recovery path, and the only one this workflow had no way to offer.
  #
  # Every other trigger in this repo can be re-run: a failed run has a Re-run
  # button, and the lanes that skip by default can be started by labelling the
  # PR. A push that GitHub never dispatched has neither — there is no run to
  # re-run.
  #
  # Observed 2026-08-31, when the 0.6.1 release PR never appeared after #96
  # merged: `actions/runs?head_sha=<merge sha>` returned zero, and stayed there.
  # Not this workflow's doing and not diagnosable from here — the squash title
  # was a clean `fix(desktop): …`, this file has no paths filter, Actions was
  # enabled with all eleven workflows active, the repo is public so no spending
  # limit applies, and githubstatus.com reported everything operational. The
  # other three workflows that fire on a main push were missing too. Whatever
  # dropped it was upstream of the repo.
  #
  # Without this the only way back is another push to main, i.e. an empty
  # commit on the release branch purely to nudge CI, which is a worse thing to
  # have to reach for than a button. Nothing is lost by waiting either way —
  # release-please reads the whole commit range since the last release, so the
  # next real merge would have picked the missed commits up — but "wait for
  # someone to merge something" is not a recovery procedure.
  #
  # Safe to press at any time: the action is idempotent. It re-derives the
  # pending release from the commit range and updates the existing release PR
  # rather than opening a second one, so a dispatch against an already-correct
  # main is a no-op.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Never cancel a run mid-flight: it may be in the middle of creating the
  # release tag, and a half-finished release is worse than a queued rerun.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # The push trigger can only ever be main; the dispatch above can be pointed
    # at any ref from the Actions UI, and this workflow holds `contents: write`
    # and cuts tags. Rather than reason about what the action does with a
    # manifest read off some other branch, it doesn't run there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # No release-type here: passing it runs the action in simple mode,
          # which ignores release-please-config.json — and with it the
          # bump-minor-pre-major 0.x settings and the 0.1.0 manifest seed
          # (observed: PR #23 proposed 1.0.0). Omitting it selects manifest
          # mode, which reads both files from their default paths.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # The desktop release promotes installers prebuilt on the release PR head.
  # release-please leaves that head alone when main gains only hidden commit
  # types, so the prebuild can fall behind the tree the merge will tag. This job
  # compares what main gained since the PR branched against packaged-app inputs.
  # On drift it fails the PR's required "Desktop release artifacts" status and
  # updates the branch from main, which starts a fresh prebuild.
  release-pr-freshness:
    needs: release-please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      RELEASE_BRANCH: release-please--branches--main--components--calandria
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fail a release PR whose prebuild main has outdated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          pull=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
            --jq '[.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY)] | first // empty')
          if [ -z "$pull" ]; then
            echo "No open release PR."
            exit 0
          fi
          pr=$(printf '%s' "$pull" | jq -r .number)
          head_sha=$(printf '%s' "$pull" | jq -r .head.sha)
          git fetch --no-tags origin "refs/pull/${pr}/head"
          main_sha=$(git rev-parse HEAD)
          base=$(git merge-base "$head_sha" "$main_sha")
          drift=$(node scripts/release-source-drift.mjs "$base" "$main_sha")
          if [ -z "$drift" ]; then
            echo "Release PR ${pr} at ${head_sha} matches main in packaged-app inputs."
            exit 0
          fi
          echo "::warning::main changed packaged-app inputs after release PR ${pr} branched:"
          printf '%s\n' "$drift"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=failure \
            -f context='Desktop release artifacts' \
            -f description='main changed packaged-app inputs after this prebuild; update the branch'
          if [ -n "$UPDATE_TOKEN" ]; then
            GH_TOKEN="$UPDATE_TOKEN" gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/update-branch" \
              -f expected_head_sha="$head_sha" \
              || echo "::warning::Could not update release PR ${pr}. Run gh pr update-branch ${pr}."
          else
            echo "::warning::RELEASE_PLEASE_TOKEN is absent. Run gh pr update-branch ${pr} to start a fresh prebuild."
          fi
