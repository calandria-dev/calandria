# Opens/updates a release PR from Conventional Commits on every push to main,
# and — once that PR is merged — cuts the GitHub Release and the `vX.Y.Z` tag.
# See issue #12 for the decision record: release-please over manual
# `gh release create`, semver 0.x while pre-1.0 (bump-minor-pre-major in
# release-please-config.json keeps a breaking change on the 0.x line instead
# of jumping to 1.0.0), and `latest` tracking the newest release rather than
# main (publish-image.yml).
#
# This runs with RELEASE_PLEASE_TOKEN, a fine-grained PAT (contents +
# pull-requests read/write, scoped to this repo) provisioned by the user and
# stored as an Actions secret. GITHUB_TOKEN would hit GitHub's recursion
# prevention twice: the release PR wouldn't get test.yml `pull_request` runs,
# and — worse — the `vX.Y.Z` tag pushed on PR merge wouldn't fire
# publish-image.yml's `push: tags:` trigger, leaving every release needing a
# manual `gh workflow run publish-image.yml --ref vX.Y.Z`. With the PAT both
# fire normally. If the secret ever lapses (fine-grained PATs expire ≤1 year),
# the action falls back to GITHUB_TOKEN and releases degrade to that manual
# dispatch — nothing breaks, it just gets slower. Agents may maintain this
# wiring; they do not provision tokens (see .github/CLAUDE.md).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # Never cancel a run mid-flight: it may be in the middle of creating the
  # release tag, and a half-finished release is worse than a queued rerun.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # No release-type here: passing it runs the action in simple mode,
          # which ignores release-please-config.json — and with it the
          # bump-minor-pre-major 0.x settings and the 0.1.0 manifest seed
          # (observed: PR #23 proposed 1.0.0). Omitting it selects manifest
          # mode, which reads both files from their default paths.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
