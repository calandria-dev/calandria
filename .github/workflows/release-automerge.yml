# The unattended release path, step two. Queues squash auto-merge on the
# release-please PR when both of these hold:
#
# 1. Every commit on main since the last `v*` tag is a bot dependency bump
#    (pin-drift.yml or Dependabot, deps scope). Any other commit leaves the
#    release for the user, per .github/CLAUDE.md.
# 2. Every check on the PR's current head finished, none failed, and the
#    lanes no required check covers succeeded: `End-to-end (Playwright)` (the
#    `e2e` label release-please.yml adds) and `Desktop release artifacts`.
#
# Both live in scripts/release-automerge-eligible.mjs. This runs after each
# workflow that reports on the release PR head, so whichever finishes last
# queues the merge. release-please.yml withdraws a queued merge whose basis is
# gone.
#
# The merge is queued with RELEASE_PLEASE_TOKEN. A merge queued with
# GITHUB_TOKEN pushes to main with no `push` runs, so release-please would cut
# no tag and publish-image.yml's gate would find no push `Test` run on the
# release commit. Without the secret this job refuses and the user merges.
name: Release auto-merge

on:
  workflow_run:
    workflows: ["Test", "Publish image", "Publish desktop artifacts"]
    types: [completed]

permissions: {}

concurrency:
  group: release-automerge
  cancel-in-progress: false

jobs:
  automerge:
    name: Queue auto-merge on a dependency-only release
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'release-please--branches--main--components--calandria'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    env:
      RELEASE_BRANCH: release-please--branches--main--components--calandria
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Queue the merge when the release is dependency-only and green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "+refs/tags/v*:refs/tags/v*"
          pull=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:${RELEASE_BRANCH}" \
            --jq '[.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY)] | first // empty')
          if [ -z "$pull" ]; then
            echo "No open release PR."
            exit 0
          fi
          pr=$(printf '%s' "$pull" | jq -r .number)
          head_sha=$(printf '%s' "$pull" | jq -r .head.sha)
          if [ "$head_sha" != "$RUN_SHA" ]; then
            echo "This run reported on ${RUN_SHA}; release PR ${pr} is now at ${head_sha}. Its own runs decide."
            exit 0
          fi
          if ! node scripts/release-automerge-eligible.mjs --base HEAD; then
            echo "Release PR ${pr} carries work beyond bot dependency bumps; it is the user's to merge."
            exit 0
          fi
          if ! node scripts/release-automerge-eligible.mjs --ready "$head_sha"; then
            echo "Release PR ${pr} head ${head_sha} is not fully green yet; a later run decides."
            exit 0
          fi
          if [ -z "$PAT" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is absent; a GITHUB_TOKEN merge would cut no tag, so release PR ${pr} stays manual"
            exit 1
          fi
          if [ "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already queued on release PR ${pr}."
            exit 0
          fi
          GH_TOKEN="$PAT" gh pr merge "$pr" --auto --squash --match-head-commit "$head_sha"
          echo "Queued auto-merge on dependency-only release PR ${pr} at ${head_sha}." | tee -a "$GITHUB_STEP_SUMMARY"
