# Build the Dockerfile and publish it to GitHub Container Registry.
#
# Shape: one native runner per architecture (no QEMU — the build stage runs
# `npm ci` + `next build`, which emulation turns from minutes into an hour),
# each pushing an anonymous by-digest blob; a final job stitches those digests
# into one multi-arch manifest and tags it. That is the standard buildx
# "distribute across runners" pattern, and it is why the per-arch jobs pass
# `outputs: type=image,push-by-digest=true` instead of `tags:`.
#
# Publishing is gated on `needs.prepare.outputs.publish`, which is false for
# every pull_request. A fork PR must never hold a token that can write to the
# registry: on `pull_request` (as opposed to `pull_request_target`) GitHub
# already caps a fork's GITHUB_TOKEN at read-only, and this workflow adds the
# belt to that brace by never running docker/login-action on the PR path.
# PRs still build both arches, so a broken Dockerfile fails before merge.
#
# It is also gated on the unit suite and the typecheck (the `test` job below
# calls test.yml, and waits on every job in it). A green `docker build` only
# proves the Dockerfile is sound — it says nothing about the code inside the
# image, and without this the registry would happily accept a `latest` whose
# tests are red.
#
# Every `uses:` here is pinned to a full commit SHA with the release tag in a
# trailing comment. `@v7` is a MUTABLE ref — whoever can move that tag can run
# code in a job that holds `packages: write`, and a SHA is the only immutable
# action reference GitHub offers. The tags are not decoration: they are what
# .github/dependabot.yml reads to know which pin is stale, and a SHA pin with
# no update bot behind it is strictly worse than a tag pin (it rots silently
# and stops collecting security fixes). Bump these via Dependabot, not by hand.
#
# The BUILD ENGINE is the deliberate exception. docker/setup-buildx-action with
# the default docker-container driver boots `moby/buildkit:buildx-stable-1` — a
# mutable tag, running privileged, holding the ghcr token, assembling the very
# layers `attest` then signs. That is a real trust surface, and it is NOT pinned
# here. Three reasons, in order of weight:
#
#   1. No bot this repo runs can bump it. Dependabot's docker ecosystem reads
#      Dockerfiles, Compose files and k8s manifests — not `driver-opts` strings
#      in a workflow (dependabot-core#5541, #5819, #6892 are the standing
#      requests). A BuildKit digest here would be exactly the unbotted SHA pin
#      the comment above calls strictly worse than a tag. Renovate's regex
#      customManagers CAN read this string; that was prototyped and declined on
#      cost, not capability — read the RENOVATE block in
#      .github/dependabot.yml before re-opening this.
#   2. This pin rots dangerously, not gently. `cache-to: type=gha` speaks a
#      GitHub-side API that has already been retired once: the v1 cache service
#      was shut off 2025-04-15, and the v2 backend needs buildx >= v0.21.0 and
#      BuildKit >= v0.20.0. Since `cache-to` has no `ignore-error=true`, an
#      engine stranded below that floor fails the build outright. A digest
#      pinned here in early 2025 would have broken the pipeline on a date
#      nobody in this repo chose.
#   3. `buildx-stable-1` is Docker's curated stable channel, not `latest` or
#      `master`, and it is the same trust root as docker/build-push-action —
#      which this job already runs. Pinning the engine while trusting the
#      action that drives it buys less than it looks like it does. Less, not
#      nothing: the image and the action are separate late-bound artifacts, so
#      a registry-side tag retarget would move the engine without touching the
#      pinned action SHA. That residual gain is weighed in dependabot.yml.
#
# What is done instead: the engine surface is REMOVED where it is free (the
# merge job needs no BuildKit at all — see `driver: docker` there) and made
# OBSERVABLE where it is load-bearing (the build job records the engine version
# and digest, and hard-fails below the cache floor). "Mutable but recorded and
# floored" is the honest position; do not upgrade it to a silent digest pin.
#
# Note this is not a reproducibility story either way. BUILT_AT is a per-run
# timestamp and `npm ci`/apt fetch live upstreams, so two builds of one commit
# already differ. Pinning BuildKit would freeze one input to a build that has
# several other unfrozen ones.
#
# CADENCE (early-stage): pushes to main do NOT build the image. The pipeline
# runs from a nightly schedule — skipped up-front in `prepare` when main's
# HEAD is already published under its sha- tag — plus v* tags and manual
# workflow_dispatch. test.yml still runs on every push, so code correctness
# stays gated per-push; only the image build is batched nightly.
#
# RELEASES (issue #12): `latest` now tracks the newest `v*` tag, not main —
# nightly/dispatch builds off main publish under `edge` instead, so
# `docker pull …:latest` and `…:edge` are an explicit choice between "newest
# release" and "newest main" rather than one tag silently meaning whichever
# ran most recently. A tag push additionally runs the release gate below
# before `build` starts. release-please.yml is what produces these tags; see
# its header for the GITHUB_TOKEN caveat on why a tag it creates may need a
# manual `workflow_dispatch --ref vX.Y.Z` nudge to reach this workflow at all.
name: Publish image

on:
  schedule:
    # 09:23 UTC ≈ 02:23 PT — off-peak, and off the top of the hour.
    - cron: "23 9 * * *"
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow-level permissions are the floor; only the jobs that talk to the
# registry raise them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are wasted work, but never cancel a publish mid-push:
  # a half-written manifest is worse than a redundant build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/calandria-dev/calandria

jobs:
  # Computes everything that must be IDENTICAL across the matrix legs — most
  # importantly BUILT_AT, which would otherwise differ per runner.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The nightly freshness check reads the registry.
      packages: read
      # The release gate below reads test.yml's run history for this SHA.
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      # False only when a scheduled run finds HEAD already published; every
      # other event always proceeds.
      proceed: ${{ github.event_name != 'schedule' || steps.fresh.outputs.run == 'true' }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      built_at: ${{ steps.vars.outputs.built_at }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      # An allowlist, not `!= pull_request`: a negative test silently starts
      # publishing the day someone adds another trigger to this file.
      # workflow_dispatch stays on the list so a branch (or an untriggered tag —
      # see release-please.yml's header) can be test-published under its sha-
      # tag; it can only move `latest`/`edge` per the ref-type rules below, not
      # by virtue of being a dispatch.
      # `schedule` publishes too: it only ever runs on the default branch.
      - name: Decide whether this event may publish
        id: gate
        run: |
          echo "publish=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}" >> "$GITHUB_OUTPUT"

      # A release is only as trustworthy as the signal it's cut from (issue
      # #12). Tag pushes don't retrigger test.yml — it only listens on
      # `push: branches: [main]` — so this queries the Test run that already
      # happened for the commit the tag points to (release-please tags a
      # merge-to-main commit; a hand-pushed tag on an untested commit has no
      # matching run either, which fails this the same way). Scoped to actual
      # tag pushes: PRs, the nightly schedule and manual dispatch already run
      # `test` themselves via the `needs: [prepare, test]` chain below.
      - name: Verify the Test workflow succeeded for this commit before releasing
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${SHA}&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "no run found"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish ${GITHUB_REF_NAME}: the Test workflow has not succeeded for ${SHA} (found: ${conclusion}). A release must be cut from a commit whose push-to-main Test run is green — see .github/CLAUDE.md and issue #12."
            exit 1
          fi
          echo "Test workflow succeeded for ${SHA}; proceeding with release ${GITHUB_REF_NAME}"

      # The nightly wins nothing when main hasn't moved: if HEAD's sha- tag is
      # already in the registry, `proceed` goes false and every downstream job
      # (test included) skips through the needs chain. Only the schedule path
      # does this check — tag pushes, PRs and dispatches always run.
      - name: Log in to ghcr.io
        if: github.event_name == 'schedule'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip the nightly when HEAD is already published
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          tag="${IMAGE}:sha-${GITHUB_SHA::7}"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nightly skipped: ${tag} is already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build provenance values
        id: vars
        run: |
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # imagetools applies these to the manifest list, not the per-arch images.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # `latest` now tracks the newest v* tag (a release), not main — see
          # the RELEASES note at the top of this file. `edge` takes over the
          # role `latest` used to play: it moves on every nightly/dispatch
          # build off main, so self-hosters get an explicit "bleeding edge"
          # tag instead of `latest` quietly meaning "whatever main was last
          # night". type=semver only ever matches on an actual tag ref, so
          # those two lines are inert outside a release build without needing
          # their own `enable=`.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

  # The correctness gate, reused from test.yml rather than copied, so there is
  # exactly one definition of "the tests pass". `build` needs it, so a red suite
  # burns ~2 minutes of runner instead of ~20 and nothing reaches ghcr.io — not
  # even the untagged by-digest blobs the matrix pushes ahead of the manifest.
  #
  # This job IS the whole called workflow, not one job inside it: it finishes
  # only when every job in test.yml finishes, and fails if any of them fails.
  # So test.yml's `typecheck` gates `build` too, automatically — there is no
  # `needs:` syntax that could reach a single job inside a called workflow
  # anyway. That duplicates what the Docker build already type-checks, and it
  # is kept on purpose: it fails in seconds instead of after a two-arch image
  # build, and the gate survives any future change to how the Dockerfile
  # builds. It is NOT worth a `typecheck: off` input to skip here.
  #
  # e2e: off — it already runs in test.yml on this same push, and the publish
  # path has its own end-of-pipeline proof in `verify` (which boots the actual
  # published image on both arches). Paying for a second full build + browser
  # run here would add ~10 minutes to every release for no new signal.
  test:
    # needs+if exist only for the nightly no-change skip; when test skips,
    # build and everything after it skip through the needs chain.
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      e2e: "off"

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` on purpose. Setting it makes the action stop using the
      # buildx that GitHub built into the runner image and instead download a
      # release binary from github.com/docker/buildx at job time — a fetch that
      # is version-pinned but not digest-pinned. That trades a binary GitHub
      # ships for one this job pulls over the network, which is the wrong
      # direction, and adds a second unbotted pin. Engine rationale: see header.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        id: buildx

      # The engine is not pinned, so record which one ran. This is the only
      # place the buildx/BuildKit that produced the signed layers is written
      # down; without it "which engine built ghcr.io/...@sha256:x" is
      # unanswerable after the fact. The floor check is the fail-closed half:
      # `type=gha` needs buildx >= v0.21.0 / BuildKit >= v0.20.0 since the v1
      # cache service was retired, and a runner or channel that ever regressed
      # below that should say so here rather than in a confusing cache error.
      - name: Record and floor-check the build engine
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          ARCH: ${{ matrix.arch }}
        # Retried 3x with a short backoff: observed failure mode is a bare
        # `exit 255` within ~0.13s of step start, zero script output, right
        # after a successful `buildx inspect --bootstrap` — a transient
        # runner/daemon hiccup (~5% of runs, both arches), not the
        # version-floor logic below. A bash loop, not an action dependency
        # (e.g. nick-fields/retry), so the retried unit stays exactly this
        # script. A genuine floor failure fails identically on every attempt
        # and still exits non-zero after the 3rd.
        run: |
          set -uo pipefail

          check_engine() (
            set -euo pipefail
            buildx=$(docker buildx version | awk '{print $2}')
            # buildx >= 0.12 prints "BuildKit version: vX.Y.Z"; older builds used
            # "Buildkit: vX.Y.Z". Match either and take the last field, so a label
            # rename upstream degrades to the explicit error below rather than to
            # an empty string that silently fails the floor check.
            buildkit=$(docker buildx inspect --builder "$BUILDER" \
              | awk '/^[[:space:]]*(BuildKit version|Buildkit):/ {print $NF; exit}')
            [ -n "$buildx" ] && [ -n "$buildkit" ] \
              || { echo "could not read engine versions (buildx='$buildx' BuildKit='$buildkit')"; exit 1; }
            # Best-effort: the digest is provenance, not a gate, so never fail on it.
            digest=$(docker image inspect moby/buildkit:buildx-stable-1 \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' 2>/dev/null || true)

            # `sort -V` orders these correctly with the leading v; if the smaller
            # of the pair is the floor itself, the installed version is >= floor.
            at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$2" ]; }
            at_least "$buildx" v0.21.0 \
              || { echo "buildx $buildx is below v0.21.0, the floor for type=gha cache"; exit 1; }
            at_least "$buildkit" v0.20.0 \
              || { echo "BuildKit $buildkit is below v0.20.0, the floor for type=gha cache"; exit 1; }

            echo "${ARCH} engine: buildx ${buildx}, BuildKit ${buildkit} ${digest:-(digest unavailable)}" \
              >> "$GITHUB_STEP_SUMMARY"
          )

          for attempt in 1 2 3; do
            if check_engine; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::engine floor-check attempt ${attempt}/3 failed, retrying..."
              sleep "$attempt"
            fi
          done
          echo "engine floor-check failed after 3 attempts" >&2
          exit 1

      - name: Log in to ghcr.io
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          # The image has no .git, so GET /api/version can only report what is
          # baked in here. Both ARGs sit at the very bottom of the Dockerfile,
          # after every COPY, so their per-build churn invalidates two trivial
          # ENV layers rather than the npm ci / next build layers above them.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ needs.prepare.outputs.built_at }}
          # Per-arch cache scopes: a shared scope would have the two legs
          # overwrite each other's manifest every run and never hit. mode=max
          # is what keeps the build stage (npm ci, next build) cached at all —
          # the default only stores layers present in the final image.
          cache-from: type=gha,scope=${{ matrix.arch }}
          # PRs read the cache but never write it. Two mode=max arch caches are
          # already most of the repo's 10 GB allowance; letting every PR add its
          # own pair would evict the main-branch entries that make builds fast.
          cache-to: ${{ needs.prepare.outputs.publish == 'true' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}
          # BuildKit's default attestation would make each leg push an index
          # rather than a plain manifest, which is the wrong input shape for the
          # imagetools merge below. Signing belongs on the merged index instead,
          # which is exactly what the `attest` job does with the digest the
          # merge job outputs. Do NOT "fix" this by turning provenance back on.
          provenance: false
          # Publish path: an untagged by-digest blob, claimed by the merge job.
          # PR path: build everything, materialize nothing.
          outputs: >-
            ${{ needs.prepare.outputs.publish == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
                || 'type=cacheonly' }}

      - name: Export digest
        if: needs.prepare.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # `driver: docker` — NOT the default docker-container. This job never
      # builds anything: `imagetools create` resolves and pushes manifests
      # through registry clients inside the buildx CLI process, with no
      # BuildKit daemon involved. The action nevertheless boots its builder
      # unconditionally (`docker buildx inspect --bootstrap`), so the default
      # driver would pull and start privileged moby/buildkit here purely to sit
      # idle next to a ghcr push token. The docker driver skips builder
      # creation entirely and binds to the local daemon, which deletes that
      # surface outright instead of pinning it — strictly better than a
      # `driver-opts` digest nothing in this repo can update. Do not "restore"
      # the default driver: it would add back a privileged container that this
      # job has no use for.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          ANNOTATIONS: ${{ needs.prepare.outputs.annotations }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r ann; do
            if [ -n "$ann" ]; then args+=(--annotation "$ann"); fi
          done <<< "$ANNOTATIONS"

          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          [ ${#refs[@]} -eq 2 ] || { echo "expected 2 per-arch digests, got ${#refs[@]}"; exit 1; }

          docker buildx imagetools create \
            --metadata-file "${RUNNER_TEMP}/manifest.json" \
            "${args[@]}" "${refs[@]}"

          # Take the index digest from the create result, not from a follow-up
          # `inspect` of the tag: the tag is mutable and a concurrent run could
          # have moved it, which would point `verify` at someone else's build.
          # (A per-arch build digest is NOT the index digest — don't reuse those.)
          digest=$(jq -er '."containerimage.digest" // ."containerimage.descriptor".digest' \
            "${RUNNER_TEMP}/manifest.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}@${digest}" >> "$GITHUB_STEP_SUMMARY"

  # Signs the merged index with SLSA build provenance — the "who built this,
  # from which commit, on which workflow" claim that `gh attestation verify`
  # checks. This is a separate job rather than a step in `merge` because the
  # per-arch legs cannot produce it: BuildKit's attestation makes each leg push
  # an index, which `imagetools create` cannot consume (see `provenance: false`
  # above). The merged index is the only artifact a user actually pulls, and it
  # is the thing worth signing.
  #
  # It runs off `needs.merge.outputs.digest` — the index digest taken from
  # `imagetools create --metadata-file`, NOT from a re-inspection of a mutable
  # tag — so the signature is bound to precisely the bytes this run published.
  #
  # Parallel with `verify` on purpose: neither needs the other, and an image
  # that fails to boot is caught by `verify` regardless of whether it got
  # signed. (Attestations are free on public repos; on a private repo they
  # would need GitHub Enterprise Cloud.)
  attest:
    needs: [prepare, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Mint the OIDC token Sigstore exchanges for a short-lived signing cert.
      id-token: write
      # Persist the attestation to the repo's attestations API.
      attestations: write
      # push-to-registry uploads the signature bundle as an OCI artifact
      # alongside the image, so this job writes to the package too.
      packages: write
    steps:
      # Required even though the action does the pushing: @sigstore/oci reads
      # the registry credentials out of the docker config this step writes.
      # Without it the attestation is signed and then fails to upload.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the published index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # No predicate/sbom input, so the action's default mode applies:
          # auto-generated SLSA build provenance.
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
          # Linked-artifact storage records were skipped while this repo lived
          # on a personal account; calandria-dev is an org, so this could be
          # revisited (`artifact-metadata: write` in permissions) if wanted.
          create-storage-record: false

  # Proves the published artifact runs, on each architecture in the manifest.
  # A green build is not evidence of a working image: the runtime stage COPYs
  # its plain-Node .mjs files by name, so a new one that nobody added to the
  # Dockerfile still builds and only fails when something imports it.
  verify:
    needs: [prepare, merge]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Job-level `env:` cannot read the `env` context, so REF is assembled in a
      # step and handed to the rest of the job through $GITHUB_ENV.
      - name: Resolve the image reference
        run: echo "REF=${IMAGE}@${{ needs.merge.outputs.digest }}" >> "$GITHUB_ENV"

      - name: Check the runtime .mjs files the build output does not bundle
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "$REF" -c '
            set -e
            for f in lib/cf-access.mjs lib/service-router.mjs lib/service-host.mjs \
                     lib/env-keys.mjs lib/resolveHostname.js lib/auth/origin.mjs \
                     lib/auth/local-origin.mjs scripts/orch-mcp.mjs lib/agentToolDefs.mjs; do
              test -f "$f" || { echo "MISSING $f"; exit 1; }
            done
            echo "runtime .mjs files present"
          '

      - name: Boot the container and wait for HEALTHCHECK
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          docker run -d --name orch \
            -e "SERVICE_TOKEN=$token" \
            -p 127.0.0.1:3000:3000 \
            "$REF"

          # HEALTHCHECK has a 20s start period and a 30s interval, so `healthy`
          # legitimately takes up to ~50s on a cold SQLite init.
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' orch)
            case "$status" in
              healthy) break ;;
              unhealthy) echo "container reported unhealthy"; exit 1 ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' orch)" != "true" ]; then
              echo "container exited before becoming healthy"; exit 1
            fi
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' orch)" = healthy ] \
            || { echo "timed out waiting for healthy"; exit 1; }

          # The healthcheck runs inside the container; confirm the port is
          # actually published and that /api/version reports THIS build.
          version=$(curl -fsS -H "x-service-token: $token" http://127.0.0.1:3000/api/version)
          echo "$version"
          echo "$version" | grep -q "${GITHUB_SHA}" \
            || { echo "/api/version did not report GIT_SHA=${GITHUB_SHA}"; exit 1; }
          echo "${ARCH} healthy: ${version}" >> "$GITHUB_STEP_SUMMARY"

      # The step above always hands the container a SERVICE_TOKEN, which is
      # exactly what hid this: with Cloudflare Access on and no token supplied,
      # the HEALTHCHECK's probe fell through to JWT verification that nothing
      # inside the container can satisfy, so it 403'd forever and the container
      # never reported healthy. docker/entrypoint.sh now mints a per-boot token
      # into /tmp and the HEALTHCHECK reads env-or-file. The Access config below
      # is deliberately bogus — the health path never contacts Cloudflare, and
      # anything that DID would fail, which is the point.
      - name: Boot under Cloudflare Access with no SERVICE_TOKEN and wait for HEALTHCHECK
        run: |
          set -euo pipefail
          docker run -d --name orch-access \
            -e "CF_ACCESS_TEAM_DOMAIN=example-team.cloudflareaccess.com" \
            -e "CF_ACCESS_AUD=ci-smoke-aud" \
            "$REF"

          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' orch-access)
            case "$status" in
              healthy) break ;;
              unhealthy) echo "container reported unhealthy under Access with no SERVICE_TOKEN"; exit 1 ;;
            esac
            if [ "$(docker inspect -f '{{.State.Running}}' orch-access)" != "true" ]; then
              echo "container exited before becoming healthy"; exit 1
            fi
            sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' orch-access)" = healthy ] \
            || { echo "timed out waiting for healthy under Access"; exit 1; }

          # And the gate is genuinely on: an unauthenticated app route must 403.
          docker exec orch-access node -e "
            fetch('http://127.0.0.1:3000/api/projects')
              .then(r => { console.log('status', r.status); process.exit(r.status === 403 ? 0 : 1) },
                    e => { console.error(e); process.exit(1) })
          "

      - name: Container logs
        if: always()
        run: |
          docker logs orch 2>&1 | tail -100 || true
          docker logs orch-access 2>&1 | tail -50 || true

  # Self-announcing failure: comments on the open `build failed`-labeled issue
  # (creating one if none is open) so a red pipeline surfaces without anyone
  # having to notice a missed email. Excluded from `pull_request`: a failing
  # PR build is already visible on the PR itself, a fork's GITHUB_TOKEN can't
  # hold `issues: write` here anyway, and filing an issue per failing PR push
  # would just be noise on top of the check that's already red.
  #
  # `needs` lists every other job so `if: failure()` (which, unlike the
  # default, does not implicitly require success — and unlike `always()`,
  # skips when nothing failed) fires on a failure anywhere in the pipeline,
  # not just in the job listed last. The existing nightly `schedule` trigger
  # doubles as the weekly canary for silent drift on no-push days, so no
  # second schedule is added here.
  notify:
    needs: [prepare, test, build, merge, attest, verify]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: jayqi/failed-build-issue-action@1a893bbf43ef1c2a8705e2b115cd4f0fe3c5649b # v1.2.0
