# Build signed desktop installers on the generated release-please PR. Store the
# installers, update feeds, blockmaps, signing notes, and checksums as workflow
# artifacts. When release-please merges the PR and creates the tag, verify and
# attach those same bytes to the published GitHub Release.
#
# The prebuild uses pull_request_target so GitHub reads this workflow from the
# protected base branch. The gate validates the release-please branch and every
# changed executable manifest before any job receives signing credentials. The
# release PR may change only version fields plus CHANGELOG.md.
#
# The tag job identifies the merged release PR through GitHub's commit-to-PR
# association. Every platform manifest must match that PR's head SHA and tree,
# and the released version. The tag may differ only in CI, tests, agent
# instructions, and Dockerfile lines outside its COPY and ADD inventory, none of
# which enter the packaged app (scripts/release-source-drift.mjs). It also
# verifies each asset's byte count and SHA-256 digest before upload. A new
# commit on the release PR produces new artifact names, so a stale run cannot
# be promoted.
#
# When the prebuild is stale or missing, dispatch with publish=true and
# rebuild=true. That builds the tag's own tree through the same handoff,
# manifest, and notes steps, then promotes those artifacts from the same run.
# release-please.yml blocks the race that produces a stale prebuild: it fails
# the release PR's required status when main changes packaged inputs after the
# prebuild.
name: Publish desktop artifacts

on:
  pull_request_target:
    branches: ["**"]
    types: [opened, synchronize, reopened]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the release PR's prebuilt artifacts to this tag"
        type: boolean
        default: false
        required: false
      rebuild:
        description: "With publish, build the tag's own tree and attach that build"
        type: boolean
        default: false
        required: false
      check_only:
        description: "Report the required skip check without building"
        type: boolean
        default: false
        required: false
      release_tag:
        description: "Existing vX.Y.Z tag to promote when dispatching from a branch"
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.event.pull_request.number || inputs.release_tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  CALANDRIA_DESKTOP_NODE_VERSION: "22.23.2"
  RELEASE_BRANCH: release-please--branches--main--components--calandria

jobs:
  gate:
    name: Release artifact gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      source_sha: ${{ steps.mode.outputs.source_sha }}
      source_pr: ${{ steps.mode.outputs.source_pr }}
      artifact_suffix: ${{ steps.mode.outputs.artifact_suffix }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      mac_signing: ${{ steps.credentials.outputs.mac }}
      win_signing: ${{ steps.credentials.outputs.win }}
    steps:
      - name: Select the workflow mode
        id: mode
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mode=skip
          source_sha=""
          source_pr=""
          suffix=""
          release_tag=""

          case "$GITHUB_EVENT_NAME" in
            pull_request_target)
              source_sha="$HEAD_SHA"
              source_pr="$PR_NUMBER"
              if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "$RELEASE_BRANCH" ]; then
                if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                  echo "::error::The release branch must belong to $GITHUB_REPOSITORY."
                  exit 1
                fi
                mode=prebuild
                suffix="pr-${PR_NUMBER}-${HEAD_SHA}"
              fi
              ;;
            push)
              if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                echo "::error::The push trigger accepts release tags only."
                exit 1
              fi
              mode=promote
              release_tag="$GITHUB_REF_NAME"
              ;;
            workflow_dispatch)
              if [ "${{ inputs.check_only }}" = "true" ]; then
                if [ "${{ inputs.publish }}" = "true" ] || [ "${{ inputs.rebuild }}" = "true" ]; then
                  echo "::error::check_only cannot be combined with publish or rebuild."
                  exit 1
                fi
                mode=check
                source_sha="$GITHUB_SHA"
              elif [ "${{ inputs.publish }}" = "true" ]; then
                if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                  if [ -n "$REQUESTED_RELEASE_TAG" ] && [ "$REQUESTED_RELEASE_TAG" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::release_tag must match the tag selected as the workflow ref."
                    exit 1
                  fi
                  release_tag="$GITHUB_REF_NAME"
                else
                  release_tag="$REQUESTED_RELEASE_TAG"
                fi
                mode=promote
                if [ "${{ inputs.rebuild }}" = "true" ]; then
                  mode=rebuild
                fi
              elif [ "${{ inputs.rebuild }}" = "true" ]; then
                echo "::error::rebuild requires publish=true."
                exit 1
              else
                mode=dry-run
                source_sha="$GITHUB_SHA"
                suffix="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              fi
              ;;
          esac

          if { [ "$mode" = "promote" ] || [ "$mode" = "rebuild" ]; } &&
             [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Publishing requires release_tag to name a vX.Y.Z tag."
            exit 1
          fi

          if [ "$mode" = "rebuild" ]; then
            ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}")
            source_sha=$(printf '%s' "$ref" | jq -r .object.sha)
            if [ "$(printf '%s' "$ref" | jq -r .object.type)" = "tag" ]; then
              source_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${source_sha}" --jq .object.sha)
            fi
            source_pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${source_sha}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == env.RELEASE_BRANCH and .head.repo.full_name == env.GITHUB_REPOSITORY)] | if length == 1 then .[0].number else error("expected one merged release-please PR") end')
            suffix="tag-${release_tag}-${source_sha}"
          fi

          {
            echo "mode=$mode"
            echo "source_sha=$source_sha"
            echo "source_pr=$source_pr"
            echo "artifact_suffix=$suffix"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "selected mode: $mode"

      - name: Mark the release artifact check pending
        if: steps.mode.outputs.mode == 'prebuild'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.mode.outputs.source_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context='Desktop release artifacts' \
            -f description='Signed desktop release artifacts are building'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.mode.outputs.mode == 'prebuild'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the generated release PR
        if: steps.mode.outputs.mode == 'prebuild'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          node scripts/validate-release-pr.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Decide which platforms can sign
        if: steps.mode.outputs.mode == 'prebuild' || steps.mode.outputs.mode == 'dry-run' || steps.mode.outputs.mode == 'rebuild'
        id: credentials
        env:
          CALANDRIA_MAC_SIGN_IDENTITY: ${{ secrets.CALANDRIA_MAC_SIGN_IDENTITY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CODE_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_CODE_SIGNING_CERT_PROFILE_NAME }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          decide() {
            local platform="$1"; shift
            local missing=()
            for name in "$@"; do
              [ -n "${!name:-}" ] || missing+=("$name")
            done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "${platform}=true" >> "$GITHUB_OUTPUT"
              echo "${platform}: signing configured"
            else
              echo "${platform}=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${platform}: publishing unsigned because these settings are absent: ${missing[*]}"
            fi
          }

          decide mac CALANDRIA_MAC_SIGN_IDENTITY CSC_LINK CSC_KEY_PASSWORD \
            APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER
          decide win AZURE_CODE_SIGNING_ENDPOINT AZURE_CODE_SIGNING_ACCOUNT_NAME \
            AZURE_CODE_SIGNING_CERT_PROFILE_NAME AZURE_CODE_SIGNING_PUBLISHER_NAME \
            AZURE_CLIENT_ID AZURE_TENANT_ID

  build:
    name: ${{ matrix.label }}
    needs: gate
    if: needs.gate.outputs.mode == 'prebuild' || needs.gate.outputs.mode == 'dry-run' || needs.gate.outputs.mode == 'rebuild'
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            label: Linux release (deb, AppImage)
            targets: --linux deb AppImage
            timeout: 45
          - os: macos-latest
            platform: mac
            label: macOS release (dmg, zip)
            targets: --mac dmg zip
            timeout: 180
          - os: windows-latest
            platform: win
            label: Windows release (NSIS, zip)
            targets: --win nsis zip
            timeout: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.CALANDRIA_DESKTOP_NODE_VERSION }}
          cache: npm

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-builder-cache
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Record the artifact identity
        id: source
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          desktop_version=$(node -p "require('./desktop/package.json').version")
          manifest_version=$(node -p "require('./.release-please-manifest.json')['.']")
          if [ "$version" != "$desktop_version" ] || [ "$version" != "$manifest_version" ]; then
            echo "::error::Root, desktop, and release manifest versions must agree."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build the app the shell serves
        # Windows webpack gets EACCES while scanning ActionsMcpHost.exe on the hosted runner. Use Turbopack there to avoid that scan.
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            npm run build -- --turbopack
          else
            npm run build
          fi

      - name: Install Electron
        run: npm run desktop:install

      - name: Stage the server payload and vendor Node
        working-directory: desktop
        run: npm run payload -- --no-build

      - name: Write the App Store Connect key to a file
        if: matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$APPLE_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          fi
          chmod 600 "$key"

      - name: Authenticate to Azure for Artifact Signing
        if: matrix.platform == 'win' && needs.gate.outputs.win_signing == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Package the release artifacts
        working-directory: desktop
        env:
          CALANDRIA_MAC_SIGN_IDENTITY: ${{ (matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true') && secrets.CALANDRIA_MAC_SIGN_IDENTITY || '' }}
          CSC_LINK: ${{ (matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true') && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ (matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true') && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ (matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true') && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ (matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ (matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true') && secrets.APPLE_API_ISSUER || '' }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ (matrix.platform == 'win' && needs.gate.outputs.win_signing == 'true') && vars.AZURE_CODE_SIGNING_ENDPOINT || '' }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ (matrix.platform == 'win' && needs.gate.outputs.win_signing == 'true') && vars.AZURE_CODE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_CODE_SIGNING_CERT_PROFILE_NAME: ${{ (matrix.platform == 'win' && needs.gate.outputs.win_signing == 'true') && vars.AZURE_CODE_SIGNING_CERT_PROFILE_NAME || '' }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ (matrix.platform == 'win' && needs.gate.outputs.win_signing == 'true') && vars.AZURE_CODE_SIGNING_PUBLISHER_NAME || '' }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          DEBUG: electron-builder*,@electron/get*
        run: |
          set -euo pipefail
          unset GITHUB_BASE_REF
          for attempt in 1 2; do
            log="$RUNNER_TEMP/electron-builder-attempt-${attempt}.log"
            set +e
            npx electron-builder ${{ matrix.targets }} --publish never 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && grep -Eq 'HTTPError: Response code (500|502|503|504)' "$log"; then
              echo "::warning::electron-builder failed with a transient HTTP error; retrying once after 60 seconds"
              rm -rf dist
              sleep 60
              continue
            fi
            exit "$status"
          done

      - name: Assert the macOS artifacts are signed, notarized, and stapled
        if: matrix.platform == 'mac' && needs.gate.outputs.mac_signing == 'true'
        run: |
          set -euo pipefail
          app=$(find desktop/dist -maxdepth 2 -name '*.app' -type d | head -n 1)
          dmg=$(find desktop/dist -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$app" && test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute -vvv "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"

      - name: Stage the release handoff
        if: needs.gate.outputs.mode == 'prebuild' || needs.gate.outputs.mode == 'rebuild'
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/desktop-${{ matrix.platform }}"
          mkdir -p "$stage"
          find desktop/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.exe' -o -name 'latest*.yml' -o -name '*.blockmap' \) \
            -exec cp {} "$stage/" \;
          node scripts/release-artifact-manifest.mjs create \
            --dir "$stage" \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --source-sha "${{ needs.gate.outputs.source_sha }}" \
            --source-tree "$SOURCE_TREE" \
            --source-pr "${{ needs.gate.outputs.source_pr }}"

      - name: Upload the release handoff
        if: needs.gate.outputs.mode == 'prebuild' || needs.gate.outputs.mode == 'rebuild'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ needs.gate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/desktop-${{ matrix.platform }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Upload the installers for a manual dry run
        if: needs.gate.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ needs.gate.outputs.artifact_suffix }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Write checksums and signing notes
        if: needs.gate.outputs.mode == 'prebuild' || needs.gate.outputs.mode == 'rebuild'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release-notes-fragment"
          mkdir -p "$out"
          cd desktop/dist
          files=$(find . -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) \
            | sed 's|^./||' | sort)
          test -n "$files"
          echo "$files" | while IFS= read -r file; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$file"; else shasum -a 256 "$file"; fi
          done > "$out/SHA256SUMS-${{ matrix.platform }}.txt"

          case "${{ matrix.platform }}" in
            mac)
              if [ "${{ needs.gate.outputs.mac_signing }}" = "true" ]; then
                signing="Signed with a Developer ID Application certificate, notarized by Apple, and stapled."
              else
                signing="**Unsigned** with an ad-hoc signature. See desktop/README.md for the xattr workaround."
              fi
              ;;
            win)
              if [ "${{ needs.gate.outputs.win_signing }}" = "true" ]; then
                signing="Signed with Azure Artifact Signing."
              else
                signing="**Unsigned.** Microsoft Defender SmartScreen will warn on first run."
              fi
              ;;
            linux)
              signing="Unsigned by convention. Verify the download with SHA256SUMS.txt."
              ;;
          esac
          printf '| %s | %s |\n' "${{ matrix.label }}" "$signing" > "$out/signing-${{ matrix.platform }}.md"

      - name: Upload checksums and signing notes
        if: needs.gate.outputs.mode == 'prebuild' || needs.gate.outputs.mode == 'rebuild'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-fragment-${{ matrix.platform }}-${{ needs.gate.outputs.artifact_suffix }}
          path: ${{ runner.temp }}/release-notes-fragment/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  release-artifacts:
    name: Desktop release artifacts
    needs: [gate, build]
    if: ${{ always() && (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.check_only)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Require every release prebuild
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          GATE_RESULT: ${{ needs.gate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.gate.outputs.source_sha }}
        run: |
          set -euo pipefail
          state=success
          description='Desktop release artifacts are not required for this PR'
          if [ "$MODE" = "skip" ] || [ "$MODE" = "check" ]; then
            :
          elif [ "$GATE_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ]; then
            description='Signed desktop release artifacts are ready'
          else
            state=failure
            description='Desktop release artifacts failed'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context='Desktop release artifacts' \
            -f description="$description"
          [ "$state" = success ]

  promote:
    name: Promote prebuilt desktop artifacts
    needs: [gate, build]
    if: always() && needs.gate.result == 'success' && (needs.gate.outputs.mode == 'promote' || (needs.gate.outputs.mode == 'rebuild' && needs.build.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      # The workflow's own ref supplies the release tooling. On a tag push that
      # is the tag. A dispatch from main can promote an older tag with the
      # current tooling. Release data is read from the tag commit itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find the release PR and artifact run
        id: source
        env:
          MODE: ${{ needs.gate.outputs.mode }}
          REBUILD_SHA: ${{ needs.gate.outputs.source_sha }}
          REBUILD_PR: ${{ needs.gate.outputs.source_pr }}
          REBUILD_SUFFIX: ${{ needs.gate.outputs.artifact_suffix }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          version=$(git show "${tag_sha}:desktop/package.json" | jq -r .version)
          if [ "v${version}" != "$RELEASE_TAG" ]; then
            echo "::error::desktop/package.json is ${version}, which does not match ${RELEASE_TAG}."
            exit 1
          fi

          pull=$(gh api "repos/${GH_REPO}/commits/${tag_sha}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == env.RELEASE_BRANCH and .head.repo.full_name == env.GH_REPO)] | if length == 1 then .[0] else error("expected one merged release-please PR") end')
          pr=$(printf '%s' "$pull" | jq -r .number)

          if [ "$MODE" = "rebuild" ]; then
            if [ "$REBUILD_SHA" != "$tag_sha" ] || [ "$REBUILD_PR" != "$pr" ]; then
              echo "::error::${RELEASE_TAG} resolved to ${tag_sha} (PR ${pr}), but this run built ${REBUILD_SHA} (PR ${REBUILD_PR})."
              exit 1
            fi
            {
              echo "version=$version"
              echo "source_pr=$pr"
              echo "source_sha=$tag_sha"
              echo "source_tree=$(git rev-parse "${tag_sha}^{tree}")"
              echo "suffix=$REBUILD_SUFFIX"
              echo "run_id=$GITHUB_RUN_ID"
              echo "built_from=from the release tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_sha=$(printf '%s' "$pull" | jq -r .head.sha)
          git fetch --no-tags origin "refs/pull/${pr}/head"
          fetched_head=$(git rev-parse FETCH_HEAD)
          if [ "$fetched_head" != "$head_sha" ]; then
            echo "::error::Release PR ${pr} head moved from ${head_sha} to ${fetched_head}."
            exit 1
          fi

          unexpected_changes=$(node scripts/release-source-drift.mjs "$head_sha" "$tag_sha")
          if [ -n "$unexpected_changes" ]; then
            echo "::error::The release tag differs from the prebuilt source in packaged-app inputs. Dispatch with publish=true and rebuild=true to build the tag instead."
            printf '%s\n' "$unexpected_changes"
            exit 1
          fi

          suffix="pr-${pr}-${head_sha}"
          artifact="desktop-linux-${suffix}"
          run_id=$(gh api --method GET "repos/${GH_REPO}/actions/artifacts" \
            -f name="$artifact" -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No unexpired ${artifact} handoff exists. Dispatch with publish=true and rebuild=true to build the tag instead."
            exit 1
          fi

          workflow_id=$(gh api "repos/${GH_REPO}/actions/workflows/release-desktop.yml" --jq .id)
          run=$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")
          if ! printf '%s' "$run" | jq -e \
            --argjson workflow_id "$workflow_id" \
            --arg head_sha "$head_sha" '
              .workflow_id == $workflow_id and
              .event == "pull_request_target" and
              .status == "completed" and
              .conclusion == "success" and
              .head_sha == $head_sha and
              .head_branch == env.RELEASE_BRANCH
            ' >/dev/null; then
            echo "::error::Artifact run ${run_id} is not the successful release prebuild for PR ${pr} at ${head_sha}."
            exit 1
          fi

          {
            echo "version=$version"
            echo "source_pr=$pr"
            echo "source_sha=$head_sha"
            echo "source_tree=$(git rev-parse "${head_sha}^{tree}")"
            echo "suffix=$suffix"
            echo "run_id=$run_id"
            echo "built_from=on the release PR"
          } >> "$GITHUB_OUTPUT"

      - name: Download the prebuilt platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*-${{ steps.source.outputs.suffix }}
          path: handoff
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download checksums and signing notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-notes-fragment-*-${{ steps.source.outputs.suffix }}
          path: fragments
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify the handoff and attach every asset
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_PR: ${{ steps.source.outputs.source_pr }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-manifest.mjs verify \
            --root handoff \
            --version "$VERSION" \
            --source-pr "$SOURCE_PR" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --asset-list "$RUNNER_TEMP/release-assets.txt"
          awk '!/\/builder-debug\.yml$/' "$RUNNER_TEMP/release-assets.txt" \
            > "$RUNNER_TEMP/release-assets.filtered.txt"
          mv "$RUNNER_TEMP/release-assets.filtered.txt" "$RUNNER_TEMP/release-assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::The verified handoff contains no assets."
            exit 1
          fi

          declare -A upload_names=()
          for asset in "${assets[@]}"; do
            name=${asset##*/}
            normalized=$(printf '%s' "$name" | tr -c 'A-Za-z0-9' '-')
            if [ -n "${upload_names[$normalized]:-}" ]; then
              echo "::error::${asset} and ${upload_names[$normalized]} map to the same GitHub release asset name."
              exit 1
            fi
            upload_names[$normalized]=$asset
          done

          cd handoff
          for asset in "${assets[@]}"; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          done

      - name: Assert every prebuilt asset reached the release
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort > attached.txt
          norm() { printf '%s' "$1" | tr -c 'A-Za-z0-9' '-'; }
          while IFS= read -r asset; do
            name=${asset##*/}
            want=$(norm "$name")
            found=$(awk -v want="$want" '{ value=$0; gsub(/[^A-Za-z0-9]/, "-", value) } value == want { count++ } END { print count+0 }' attached.txt)
            if [ "$found" != "1" ]; then
              echo "::error::${name} matches ${found} release assets after GitHub filename normalization."
              exit 1
            fi
          done < "$RUNNER_TEMP/release-assets.txt"

      - name: Assemble and attach SHA256SUMS.txt
        run: |
          set -euo pipefail
          cat fragments/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          norm() { printf '%s' "$1" | tr -c 'A-Za-z0-9' '-'; }
          : > SHA256SUMS.reconciled
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            hash=${line:0:64}
            sep=${line:64:2}
            name=${line:66}
            want=$(norm "$name")
            match=$(awk -v want="$want" '{ value=$0; gsub(/[^A-Za-z0-9]/, "-", value) } value == want { print }' assets.txt)
            found=$(printf '%s\n' "$match" | grep -c . || true)
            if [ "$found" != "1" ]; then
              echo "::error::Checksum entry ${name} matches ${found} release assets."
              exit 1
            fi
            printf '%s%s%s\n' "$hash" "$sep" "$match" >> SHA256SUMS.reconciled
          done < SHA256SUMS.txt
          mv SHA256SUMS.reconciled SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber

      - name: Record signing and download details
        env:
          BUILT_FROM: ${{ steps.source.outputs.built_from }}
        run: |
          set -euo pipefail
          marker='<!-- desktop-artifacts -->'
          gh release view "$RELEASE_TAG" --json body --jq .body > body.md
          awk -v marker="$marker" 'index($0, marker) { exit } { print }' body.md > notes.md
          {
            echo "$marker"
            echo
            echo "### Desktop app"
            echo
            echo "| Platform | Signing |"
            echo "|-|-|"
            cat fragments/signing-*.md
            echo
            echo "These installers were built and verified ${BUILT_FROM}. Verify a download with:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing   # shasum -a 256 -c on macOS"
            echo '```'
            echo
            echo "macOS ships a dmg for installation and a zip for updates."
            echo "Windows ships an NSIS installer and a zip."
            echo "Linux ships a deb and an AppImage."
            echo "Every platform is x64 except macOS, which is Apple silicon arm64."
          } >> notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
