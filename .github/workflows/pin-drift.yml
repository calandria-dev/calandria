# Advance notice for the Dockerfile pins that rot without telling anyone.
#
# `gh=<version>` and `AGY_VERSION` have upstreams that serve exactly one
# version, so an upstream release does not make the pin old, it makes it GONE,
# and the build fails. `gh` is the worse of the two, because publish-image.yml's `type=gha`
# layer cache keeps reusing the layer that installed the old version: the
# `Publish image` lane stayed green through a `gh` pin that no cold build could
# resolve, and it was found only because PR #183 happened to build locally
# without a cache. Issue #182 was the second time the agy pin fired.
#
# `CLAUDE_CODE_VERSION` and `CODEX_VERSION` fail the other way. npm keeps old
# versions, so those still build — what breaks is behaviour, and silently:
# `@openai/codex` sat seven minors back at 0.146.0 and GPT-6 Astra could not run
# on it at all ("model requires a newer version of codex"). A new model can
# require a CLI bump, so being behind is not cosmetic. They are reported on
# STALENESS (three weeks old, or three newer minors) rather than on difference,
# because claude-code ships ~25 releases a month and "newer exists" would be a
# notice a day. Thresholds and the reasoning are in the script.
#
# The pins themselves stay (issue #21, and the comments at the Dockerfile
# sites). This is the missing half: a check that reads each upstream, compares
# it with the Dockerfile, and turns a surprise into an issue filed days earlier.
# The equality this check cannot see — `@openai/codex-sdk` against
# `CODEX_VERSION` — is repaired in the bump job with npm's lockfile writer and
# remains guarded by `tests/cliPins.test.ts`.
#
# THE AGENT CLI PINS ARE A PULL REQUEST, NOT AN ISSUE PARAGRAPH. The AGY vendor
# manifests and npm's exact CLI versions are sufficient to produce the change:
# the vendor's manifest is the whole source of truth, it carries the version and
# the SHA-512 this job already fetched, and the Dockerfile's own guard rejects
# any pair that does not match what is being served. So the `bump` job below
# rewrites all three ARGs on one stable bot branch and opens or refreshes one
# pull request. It queues auto-merge only after the branch head is verified and
# all required CI contexts are dispatched against it. CI and the branch ruleset
# are the merge gate; this workflow never bypasses failed checks.
#
# WHY NOT A BOT, REVISITED. .github/dependabot.yml covers what Dependabot can
# see: action SHAs, the base-image digest, website/ npm. Its `docker` ecosystem
# reads `FROM` lines and rewrites digests; it has no idea what `gh=2.99.0`
# inside a `RUN` or an `ARG AGY_VERSION` mean. Renovate's regex customManagers
# CAN see both, and were prototyped against this repo and declined, for the
# reasons recorded at length in dependabot.yml. Both of those are third-party
# bots that would have to be trusted with write access to this repo and given a
# credential that outlives any one run. The `bump` job is neither: it is forty
# lines in this repo, it runs on the built-in `GITHUB_TOKEN`, and there is no
# standing PAT or GitHub App behind it. `gh=` stays a notice because the apt
# index carries no checksum to write. The Agent SDK remains an issue because it
# changes the turn contract and needs its own behavioral review.
#
# WHY THE BUMP JOB DISPATCHES CI. A push made with `GITHUB_TOKEN` fires no
# `push` workflow. A `pull_request` workflow caused by a PR opened with that
# token can start in `action_required`, pending approval, so the bot PR can
# have held checks even though the workflows exist. That is GitHub's recursion
# and approval behavior. The fix is neither a PAT nor a weakened ruleset:
# `workflow_dispatch` supplies deterministic checks, and the job approves only
# the held `pull_request` runs for the exact PR head after the PR exists. Check
# runs attach to the head SHA rather than to the PR, and the PR's head SHA is
# the bot branch's head. The job dispatches `Test`, the desktop release skip
# check, and `Publish image` against that branch. It refuses to finish until
# each dispatched workflow has a run whose `headSha` is the commit it pushed,
# and until the expected `PR title`, `Test` and `Publish image` pull-request
# runs exist. A missing run means a PR with missing checks, and that is a red
# job here.
name: Pin drift

on:
  schedule:
    # 08:11 UTC, an hour ahead of `Publish image`'s nightly 09:23, so a pin that
    # aged out overnight is already an open issue by the time the build it
    # breaks would have run. Daily rather than weekly because the check is a
    # handful of GETs against static files — cheaper than the notice being six
    # days late. The staleness thresholds, not the cron, are what keep the
    # class-two pins from filing something every morning.
    - cron: "11 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        # Proves the bump path end to end without putting a pull request in
        # front of anyone: the branch is pushed and both workflows are
        # dispatched and confirmed, and nothing else happens. Cut from the
        # DISPATCHING ref rather than from main, so a change to this file can
        # be exercised on its own PR branch before it is merged.
        description: "Push a throwaway branch and dispatch CI, but publish no issue or pull request"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # One stable branch, force-pushed. A branch per version would leave a trail of
  # abandoned refs and a second open PR every time the vendor shipped twice
  # before anyone reviewed the first. A dry run gets its own throwaway name, so
  # it can never touch the branch a real pull request is open on.
  BOT_BRANCH: bot/agent-cli-pins
  DRY_RUN_BRANCH: bot/agent-cli-pins-dry-run
  # Read off `github.event` so only the `github` context is needed. A workflow
  # env key evaluated on a `schedule` event has no `inputs` to read, and an
  # expression a context cannot satisfy is a `startup_failure`, which produces
  # no check runs and appears in no PR (.github/CLAUDE.md).
  DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # For the drift issue below. Nothing in THIS job writes code: it rewrites
      # the Dockerfile in its own workspace and throws it away, passing the
      # three values it decided on to the `bump` job as an output instead. That
      # is what keeps `contents: write` off the job that talks to the issue
      # tracker.
      issues: write
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      agy: ${{ steps.agy.outputs.summary }}
      agy_changed: ${{ steps.agy.outputs.changed }}
      agy_version: ${{ steps.agy.outputs.version }}
      agy_from: ${{ steps.agy.outputs.from }}
      agy_kind: ${{ steps.agy.outputs.kind }}
      npm: ${{ steps.npm.outputs.summary }}
      npm_changed: ${{ steps.npm.outputs.changed }}
      claude_version: ${{ steps.npm.outputs.claude_version }}
      codex_version: ${{ steps.npm.outputs.codex_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Claude Code releases for alias comparison
        run: |
          set -euo pipefail
          pinned="$(awk '
            $1 == "ARG" && $2 ~ /^CLAUDE_CODE_VERSION=/ {
              sub(/^CLAUDE_CODE_VERSION=/, "", $2)
              print $2
              exit
            }
          ' Dockerfile)"
          if [ -z "$pinned" ]; then
            echo "::error::Dockerfile has no CLAUDE_CODE_VERSION ARG"
            exit 1
          fi
          latest="$(npm view @anthropic-ai/claude-code version)"
          if [ -z "$latest" ]; then
            echo "::error::npm returned no Claude Code version"
            exit 1
          fi

          pinned_prefix="$RUNNER_TEMP/claude-alias-pinned"
          latest_prefix="$RUNNER_TEMP/claude-alias-latest"
          npm install --prefix "$pinned_prefix" --no-audit --no-fund --package-lock=false \
            "@anthropic-ai/claude-code@$pinned"
          npm install --prefix "$latest_prefix" --no-audit --no-fund --package-lock=false \
            "@anthropic-ai/claude-code@$latest"

          pinned_bin="$pinned_prefix/node_modules/.bin/claude"
          latest_bin="$latest_prefix/node_modules/.bin/claude"
          test -x "$pinned_bin"
          test -x "$latest_bin"
          {
            echo "CLAUDE_ALIAS_PINNED_BIN=$pinned_bin"
            echo "CLAUDE_ALIAS_LATEST_BIN=$latest_bin"
          } >> "$GITHUB_ENV"

      # No setup-node and no `npm ci`: the script imports nothing outside
      # node:*, so the runner's bundled Node runs it as-is. The two temporary
      # prefixes above exist only for the CLI behavior probe.
      - name: Compare pins with upstream
        id: check
        run: |
          set -euo pipefail
          status=0
          node scripts/check-pin-drift.mjs \
            --report "$RUNNER_TEMP/drift.md" \
            --update-agy \
            --agy-summary "$RUNNER_TEMP/agy.json" \
            --update-npm \
            --npm-summary "$RUNNER_TEMP/npm.json" \
            --claude-alias-pinned-bin "$CLAUDE_ALIAS_PINNED_BIN" \
            --claude-alias-latest-bin "$CLAUDE_ALIAS_LATEST_BIN" || status=$?
          case "$status" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            # Exit 2 is the check failing, not a pin failing — an unreachable
            # upstream, a pin it can no longer find in the Dockerfile because
            # the ARG was renamed, or an agy manifest pair it refuses to write
            # a bump from (the two arches disagreeing on the version, a digest
            # that is not 128 hex characters). Go red instead of reporting an
            # all-clear; the notify job below is what makes that red visible.
            *) exit "$status" ;;
          esac

      - name: Read the agy decision
        id: agy
        run: |
          set -euo pipefail
          # Compact, because a job output is one line. The digests travel with
          # the version so the `bump` job writes exactly what was compared
          # here, rather than asking the manifest a second question and
          # possibly getting a second answer.
          {
            echo "summary=$(jq -c . "$RUNNER_TEMP/agy.json")"
            echo "changed=$(jq -r .changed "$RUNNER_TEMP/agy.json")"
            echo "version=$(jq -r .version "$RUNNER_TEMP/agy.json")"
            echo "from=$(jq -r .from "$RUNNER_TEMP/agy.json")"
            echo "kind=$(jq -r '.kind // "none"' "$RUNNER_TEMP/agy.json")"
          } >> "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/agy.json"

      - name: Read the npm decision
        id: npm
        run: |
          set -euo pipefail
          {
            echo "summary=$(jq -c . "$RUNNER_TEMP/npm.json")"
            echo "changed=$(jq -r 'length > 0' "$RUNNER_TEMP/npm.json")"
            echo "claude_version=$(jq -r '.claudeCode // empty' "$RUNNER_TEMP/npm.json")"
            echo "codex_version=$(jq -r '.codexVersion // empty' "$RUNNER_TEMP/npm.json")"
          } >> "$GITHUB_OUTPUT"
          jq . "$RUNNER_TEMP/npm.json"

      - name: Open, update or close the drift issue
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.check.outputs.drift }}
        run: |
          set -euo pipefail
          # `gh issue create --label` fails outright on a label that does not
          # exist, so the first run has to create it.
          gh label create pin-drift \
            --description "A pinned agent CLI needs a bump" \
            --color d93f0b >/dev/null 2>&1 || true

          existing="$(gh issue list --label pin-drift --state open \
            --json number --jq '.[0].number // empty')"

          if [ "$DRIFT" = "true" ]; then
            if [ -n "$existing" ]; then
              # Rewrite the body rather than adding a comment. This runs daily,
              # and a comment a day would notify everyone subscribed about a
              # fact they already have; the body is regenerated so a SECOND pin
              # ageing out still shows up on the same issue.
              gh issue edit "$existing" --body-file "$RUNNER_TEMP/drift.md"
              echo "Updated #$existing."
            else
              gh issue create \
                --title "A pinned agent CLI needs a bump" \
                --label pin-drift \
                --body-file "$RUNNER_TEMP/drift.md"
            fi
          elif [ -n "$existing" ]; then
            # Self-closing, so the issue tracks the live state instead of
            # needing someone to remember it after the bump lands. An agy-only
            # drift no longer reaches this branch at all: --update-agy drops
            # those findings, so the issue closes and the pull request carries
            # the news.
            gh issue close "$existing" \
              --comment "Every pin is current again. Closed by \`Pin drift\`."
            echo "Closed #$existing."
          else
            echo "No drift, and no open issue to close."
          fi

  # The half that writes. Separate from `check` so the scopes are separate: this
  # job never touches the issue tracker, and `check` never holds a token that
  # can push.
  bump:
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Force-pushes the bot branch. It is bot-owned by construction: every run
      # recreates it from main, so nothing a human commits there survives.
      contents: write
      pull-requests: write
      # `gh workflow run`. See the header: this is what gives the PR checks.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      AGY: ${{ needs.check.outputs.agy }}
      AGY_CHANGED: ${{ needs.check.outputs.agy_changed }}
      AGY_VERSION: ${{ needs.check.outputs.agy_version }}
      AGY_FROM: ${{ needs.check.outputs.agy_from }}
      AGY_KIND: ${{ needs.check.outputs.agy_kind }}
      NPM: ${{ needs.check.outputs.npm }}
      NPM_CHANGED: ${{ needs.check.outputs.npm_changed }}
      CLAUDE_VERSION: ${{ needs.check.outputs.claude_version }}
      CODEX_VERSION: ${{ needs.check.outputs.codex_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches, so the bot branch's current head is available to
          # compare against without a second fetch that has to handle "the
          # branch does not exist yet".
          fetch-depth: 0

      - name: Pick the branch this run may write
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "BOT_BRANCH=$DRY_RUN_BRANCH" >> "$GITHUB_ENV"
          fi
          echo "Dry run: $DRY_RUN"

      - name: Retire the bot branch now that the pins are current
        if: env.AGY_CHANGED != 'true' && env.NPM_CHANGED != 'true'
        run: |
          set -euo pipefail
          # `changed` is computed against the Dockerfile on the ref this
          # workflow ran from, which on the daily schedule is main. False means
          # main already carries these pins, so an open bot PR is proposing a
          # change that has landed some other way.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run with nothing to bump; leaving everything alone."
            exit 0
          fi
          open="$(gh pr list --head "$BOT_BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh pr close "$open" --delete-branch \
              --comment "The agent CLI pins on main are already current. Closed by \`Pin drift\`."
            echo "Closed #$open."
          else
            echo "Pins are current and no bot PR is open."
          fi
          legacy="$(gh pr list --head bot/agy-pin --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$legacy" ]; then
            gh pr close "$legacy" --delete-branch \
              --comment "The agent CLI pins on main are already current. Closed by \`Pin drift\`."
            echo "Closed legacy PR #$legacy."
          fi

      - name: Cut the branch and apply the bump
        id: branch
        if: env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$AGY" > "$RUNNER_TEMP/agy.json"
          printf '%s' "$NPM" > "$RUNNER_TEMP/npm.json"
          # Copied out before the branch switch: the updater that runs is the
          # one on the ref that dispatched this workflow, applied to the
          # Dockerfile on the branch being cut. Without the copy a dry run from
          # a PR branch would silently run main's older script.
          cp scripts/check-pin-drift.mjs "$RUNNER_TEMP/updater.mjs"

          if [ "$DRY_RUN" = "true" ]; then
            base="$(git rev-parse HEAD)"
          else
            git fetch --no-tags origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          # Always cut fresh from the base rather than adding a commit to
          # whatever is on the bot branch, so the PR is main plus exactly one
          # commit and never carries a superseded version underneath it.
          git checkout --quiet -B "$BOT_BRANCH" "$base"
          node "$RUNNER_TEMP/updater.mjs" --apply-agy "$RUNNER_TEMP/agy.json"
          node "$RUNNER_TEMP/updater.mjs" --apply-npm "$RUNNER_TEMP/npm.json"

          if [ "$NPM_CHANGED" = "true" ] && [ -n "$CODEX_VERSION" ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm run fix-lockfile
          fi

          if git diff --quiet -- Dockerfile package.json package-lock.json; then
            echo "::error::the bump applied nothing; the base already carries the reported pins"
            exit 1
          fi

          if [ "$AGY_CHANGED" = "true" ] && [ "$NPM_CHANGED" != "true" ] && [ "$AGY_KIND" = "digest" ]; then
            title="build(deps): refresh the Antigravity CLI $AGY_VERSION checksums"
          elif [ "$AGY_CHANGED" = "true" ] && [ "$NPM_CHANGED" != "true" ]; then
            title="build(deps): bump Antigravity CLI to $AGY_VERSION"
          elif [ "$NPM_CHANGED" = "true" ] && [ "$AGY_CHANGED" != "true" ] && [ -n "$CLAUDE_VERSION" ] && [ -z "$CODEX_VERSION" ]; then
            title="build(deps): bump Claude Code CLI to $CLAUDE_VERSION"
          elif [ "$NPM_CHANGED" = "true" ] && [ "$AGY_CHANGED" != "true" ] && [ -z "$CLAUDE_VERSION" ] && [ -n "$CODEX_VERSION" ]; then
            title="build(deps): bump Codex CLI to $CODEX_VERSION"
          else
            title="build(deps): refresh agent CLI pins"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile package.json package-lock.json
          {
            echo "$title"
            echo
            echo "Refresh the stale agent CLI pins selected by the daily pin check."
            if [ "$AGY_CHANGED" = "true" ]; then
              echo "Antigravity: $AGY_FROM -> $AGY_VERSION ($AGY_KIND)."
            fi
            if [ -n "$CLAUDE_VERSION" ]; then
              echo "Claude Code: $CLAUDE_VERSION."
            fi
            if [ -n "$CODEX_VERSION" ]; then
              echo "Codex CLI and SDK: $CODEX_VERSION."
            fi
            echo
            echo "Opened by .github/workflows/pin-drift.yml."
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit --quiet -F "$RUNNER_TEMP/commit-message.txt"

          # A daily no-op force-push would re-dispatch both workflows and
          # re-notify everyone watching the PR about a fact that has not
          # changed, so the branch is only pushed when its content or its base
          # actually moved. The SHA every later step works from is whichever
          # commit the remote branch ends up at.
          if git rev-parse --verify --quiet "origin/$BOT_BRANCH" >/dev/null \
            && [ "$(git rev-parse "origin/$BOT_BRANCH^{tree}")" = "$(git rev-parse 'HEAD^{tree}')" ] \
            && [ "$(git rev-parse "origin/$BOT_BRANCH^")" = "$base" ]; then
            head="$(git rev-parse "origin/$BOT_BRANCH")"
            echo "$BOT_BRANCH already proposes these pins on this base."
          else
            git push --force origin "HEAD:refs/heads/$BOT_BRANCH"
            head="$(git rev-parse HEAD)"
            echo "Pushed $head to $BOT_BRANCH."
          fi
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"

      # Before the PR, so its body can name the runs. Dispatch is also the step
      # most likely to fail, and failing it before a PR exists leaves nothing
      # half-opened behind.
      - name: Dispatch the checks and confirm they attached to the branch head
        id: dispatch
        if: env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true'
        env:
          SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/runs.md"

          run_url_for() {
            gh run list --workflow "$1" --branch "$BOT_BRANCH" --limit 30 \
              --json headSha,url --jq "[.[] | select(.headSha == \"$SHA\")] | .[0].url // empty"
          }

          dispatch_and_confirm() {
            workflow="$1"
            label="$2"
            shift 2
            url="$(run_url_for "$workflow")"
            if [ -n "$url" ]; then
              echo "$workflow already has a run for $SHA."
            else
              gh workflow run "$workflow" --ref "$BOT_BRANCH" "$@"
              # The dispatch API answers before the run row is queryable, and
              # there is no id in its response to poll on.
              for _ in $(seq 1 24); do
                sleep 5
                url="$(run_url_for "$workflow")"
                if [ -n "$url" ]; then break; fi
              done
            fi
            if [ -z "$url" ]; then
              echo "::error::$workflow produced no run for $SHA, so the pull request would have no $label checks"
              return 1
            fi
            echo "- $label: $url" >> "$RUNNER_TEMP/runs.md"
          }

          # The test contexts (`.github/rulesets/README.md`) come from
          # test.yml's own run, not from the copy publish-image.yml calls, whose
          # jobs report as `test / …` and match no rule. Both slow-lane inputs
          # are off: a Dockerfile ARG cannot change how the app behaves in a
          # browser or in an Electron shell, and `auto` reads a manual dispatch
          # as a person opting in. This one is a cron, and `macos=auto` would
          # buy a 70-minute macOS runner on every bump.
          dispatch_and_confirm test.yml Test -f e2e=off -f macos=off

          # The desktop release check does real work only for the generated
          # release-please PR. This dispatch attaches its required skip result
          # to the bot branch without starting the three packaging runners.
          dispatch_and_confirm release-desktop.yml "Desktop release artifacts" \
            -f check_only=true

          # The one check that actually reviews this change. `publish=false`
          # builds both arches and materializes nothing, so no sha- tag appears
          # in the registry for a commit nobody has read yet. `no_cache=true`
          # because a cached agy layer is precisely how a rotten pin stays
          # invisible (publish-image.yml's Sunday leg exists for the same
          # reason): the ARG change does invalidate that layer on its own, but
          # this is the build whose whole job is to prove the checksums, and it
          # is not the place to rely on a cache-key inference.
          dispatch_and_confirm publish-image.yml "Publish image" \
            -f no_cache=true -f publish=false

          {
            echo "### Dispatched against \`$SHA\`"
            echo
            cat "$RUNNER_TEMP/runs.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or refresh the pull request
        id: pr
        if: (env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true') && env.DRY_RUN != 'true'
        env:
          SHA: ${{ steps.branch.outputs.head_sha }}
          TITLE: ${{ steps.branch.outputs.title }}
        run: |
          set -euo pipefail
          {
            if [ "$AGY_CHANGED" = "true" ] && [ "$AGY_KIND" = "digest" ]; then
              echo "The Antigravity updater manifests still name \`$AGY_VERSION\`, but they are"
              echo "serving a different tarball. \`sha512sum -c\` in the Dockerfile fails against"
              echo "the digests currently pinned, so this refreshes both of them. **A rebuilt"
              echo "tarball under an unchanged version is the case worth looking at hardest.**"
            elif [ "$AGY_CHANGED" = "true" ]; then
              echo "The Antigravity updater manifests moved from \`$AGY_FROM\` to \`$AGY_VERSION\`."
              echo "They serve exactly one build, so the old pin no longer resolves and every"
              echo "image build fails on the Dockerfile's own \`AGY_VERSION\` guard until this lands."
            fi
            if [ "$AGY_CHANGED" = "true" ]; then
              echo
              echo "\`AGY_VERSION\`, \`AGY_SHA512_AMD64\` and \`AGY_SHA512_ARM64\` are copied verbatim"
              echo "from these two documents, which are also what the build resolves against:"
              echo
              echo "- <https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json>"
              echo "- <https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_arm64.json>"
            fi
            echo
            echo "### What reviews this"
            echo
            echo "\`Test\`, the desktop artifact check and \`Publish image\` were dispatched"
            echo "against this exact head. The image build runs for both architectures with the"
            echo "layer cache off and pushes nothing to the registry. It installs each selected"
            echo "CLI and prints its version, so an unavailable or incompatible pin is a red check."
            if [ "$AGY_CHANGED" = "true" ]; then
              echo "It also re-fetches both Antigravity manifests, checks \`AGY_VERSION\`, and"
              echo "runs \`sha512sum -c\` with the digest for each architecture."
            fi
            echo
            cat "$RUNNER_TEMP/runs.md"
            echo
            if [ "$NPM_CHANGED" = "true" ]; then
              echo "The Dockerfile CLI pins were refreshed from npm's latest versions."
              if [ -n "$CODEX_VERSION" ]; then
                echo "Codex's SDK dependency and package lock were regenerated at the same version."
              fi
              echo
            fi
            echo "The dispatched CI checks and the branch ruleset are the merge gate."
            echo "This PR merges automatically after every required check passes. A failure leaves"
            echo "it open for diagnosis."
            echo
            echo "---"
            echo
            echo "Opened by \`.github/workflows/pin-drift.yml\`, force-pushed on \`$BOT_BRANCH\`."
            echo "Head \`$SHA\`. Last refreshed $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          } > "$RUNNER_TEMP/pr.md"

          existing="$(gh pr list --head "$BOT_BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
            echo "Refreshed #$existing."
          else
            existing="$(gh pr create --base main --head "$BOT_BRANCH" \
              --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
            )"
            existing="${existing##*/}"
          fi
          echo "number=$existing" >> "$GITHUB_OUTPUT"
          echo "Opened or refreshed PR #$existing for head $SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Retire the legacy AGY-only pull request
        if: (env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true') && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          legacy="$(gh pr list --head bot/agy-pin --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$legacy" ]; then
            gh pr close "$legacy" --delete-branch \
              --comment "Superseded by #${{ steps.pr.outputs.number }} on \`$BOT_BRANCH\`. Closed by \`Pin drift\`."
            echo "Closed legacy PR #$legacy."
          fi

      - name: Approve held pull-request checks for the exact head
        if: (env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true') && env.DRY_RUN != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail

          # A PR opened by GITHUB_TOKEN can create these pull_request runs in
          # action_required. Wait for all three expected workflows before
          # approving anything, and filter every API result by both the PR and
          # exact head SHA so an older or unrelated run can never be approved.
          runs_file="$RUNNER_TEMP/pull-request-runs.json"
          missing="PR title,Test,Publish image"
          for _ in $(seq 1 24); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" > "$runs_file"
            missing="$(jq -r --arg sha "$SHA" --arg pr "$PR_NUMBER" '
              ["PR title", "Test", "Publish image"] as $expected
              | [.workflow_runs[]
                | select(.event == "pull_request" and .head_sha == $sha)
                | select(any(.pull_requests[]?; (.number | tostring) == $pr))
                | .name]
              | ($expected - unique)
              | join(",")
            ' "$runs_file")"
            if [ -z "$missing" ]; then
              break
            fi
            sleep 5
          done

          if [ -n "$missing" ]; then
            echo "::error::expected pull_request workflow runs never materialized for $SHA: $missing"
            exit 1
          fi

          while IFS=$'\t' read -r run_id run_name; do
            [ -n "$run_id" ] || continue
            echo "Approving $run_name run $run_id for exact head $SHA."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" \
              >/dev/null
          done < <(jq -r --arg sha "$SHA" --arg pr "$PR_NUMBER" '
            .workflow_runs[]
            | select(.event == "pull_request" and .head_sha == $sha)
            | select(any(.pull_requests[]?; (.number | tostring) == $pr))
            | select(.name == "PR title" or .name == "Test" or .name == "Publish image")
            | select(.conclusion == "action_required")
            | [.id, .name]
            | @tsv
          ' "$runs_file")

          echo "All expected pull_request workflow runs exist for exact head $SHA."

      - name: Queue auto-merge after verifying the PR head
        if: (env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true') && env.DRY_RUN != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          read -r state draft head queued < <(
            gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid,autoMergeRequest \
              --jq '[.state, (.isDraft | tostring), .headRefOid, ((.autoMergeRequest != null) | tostring)] | @tsv'
          )
          if [ "$state" != "OPEN" ] || [ "$draft" != "false" ] || [ "$head" != "$SHA" ]; then
            echo "::error::refusing auto-merge: PR #$PR_NUMBER is state=$state draft=$draft head=$head, expected open non-draft head=$SHA"
            exit 1
          fi
          if [ "$queued" = "true" ]; then
            echo "Auto-merge is already queued for PR #$PR_NUMBER."
          else
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch \
              --match-head-commit "$SHA"
          fi

      # Informational, and not a gate. Check runs appear on a
      # commit once their jobs leave the queue, which is the same mechanism a
      # pull request's check list reads; the run-exists assertion above is what
      # this job actually stands on, because runner queue time is not something
      # to redden a daily cron over.
      - name: Report what has attached to the branch head so far
        if: env.AGY_CHANGED == 'true' || env.NPM_CHANGED == 'true'
        continue-on-error: true
        env:
          SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          set -euo pipefail
          sleep 20
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
            --jq '.check_runs[] | "- \(.name): \(.status)"' \
            | sort | tee -a "$GITHUB_STEP_SUMMARY"

  # A checker that dies quietly is worth nothing, which is the whole failure
  # mode this workflow exists to fix. Same action and same shape as
  # publish-image.yml's notify job, so a broken check announces itself the way a
  # broken build does. Restricted to `schedule`: a manual dispatch is somebody
  # already watching, and should not file build-failure issues while debugging.
  notify:
    needs: [check, bump]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: jayqi/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          # Required, and the action has no default — see the same note in
          # publish-image.yml's notify job (issue #26).
          github-token: ${{ github.token }}
