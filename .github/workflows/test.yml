# Run the test suites. This is the repo's correctness gate; publish-image.yml
# calls it (see `workflow_call` below) so a red suite can never reach ghcr.io.
#
# Nine jobs, deliberately on different schedules:
#
#   audit — `npm audit --omit=dev --audit-level=high`. Seconds. Runs on
#           everything, always — the same coverage repeats weekly, unattended,
#           in security-scan.yml, so a newly-disclosed advisory against
#           unchanged code is still caught between pushes.
#   typecheck — `npm run typecheck` (next typegen + tsc --noEmit). Seconds.
#           Runs on everything, always. This repo has no lint script, so tsc IS
#           the static gate — and it otherwise only runs as a side effect of
#           `next build` (next.config.mjs does not set ignoreBuildErrors). That
#           build happens only in the two e2e jobs, which are label-gated,
#           and in the Docker build. Without this job an ordinary PR goes fully
#           green with a type error in it and the failure lands after merge, on
#           main, in a job that takes twenty times as long to tell you.
#   unit  — `npm test` (vitest). ~1-2 minutes. Runs on everything, always.
#   e2e   — `npm run test:e2e` (build + Playwright against the real prod server).
#           Many minutes: it does a full `next build`, boots server.js + the pty
#           sidecar against a hermetic temp instance, and drives a browser. Too
#           slow to sit in front of every PR push, so it runs on main, on manual
#           dispatch, and on a PR that carries the `e2e` label — the escape
#           hatch for a change that obviously touches the app's core flow.
#   desktop — the Electron shell in `desktop/` is a spike wired into no other
#           lane, so without this job its two existing test scripts
#           (`test:desktop:supervisor`, `test:desktop:boot`) run nowhere at all,
#           and the window layer — menu, single-instance lock, permission
#           handler, external links, quit-drains — has no automated coverage on
#           any OS. It then packages the shell (`electron-builder --dir`), moves
#           the artifact out of the checkout and runs the window suite a second
#           time against it with no CALANDRIA_REPO_ROOT — the developer path and
#           the download path are different code, and only the second one is
#           what ships. Same schedule as `e2e`; the packaged half roughly
#           doubles the job, hence its 45-minute ceiling.
#   windows — `npm run typecheck` + `npm test` on windows-latest. Calandria
#           supports native Windows (docs/WINDOWS.md), and nothing else here
#           would notice it breaking: every other job runs on Ubuntu, so a
#           POSIX-only path spelling, a `/bin/sh` assumption or a process-group
#           kill sails through green. This lane is what makes the support claim
#           in README/INSTALLATION a fact rather than an intention.
#   windows-desktop — the `desktop` suite on windows-latest. The shell's own
#           Windows half is where its behaviour actually diverges: there is no
#           deliverable SIGTERM, so `supervisor.stop()`'s kill is a
#           TerminateProcess and the quit-drain degrades to a hard stop; the
#           sidecars are in no job object, so a `taskkill` without `/T` orphans
#           them; and `sidecarEnv()` has to invent a `SHELL` the pty sidecar can
#           spawn because $SHELL is a POSIX convention. The Ubuntu lane runs the
#           same specs and can say nothing about any of it.
#   macos-desktop — the `desktop` suite on macos-latest against the dev shell
#           and then the packaged .app, plus a launch of the .app unpacked from
#           the .dmg that same build produced (docs/DESKTOP_APP.md §6.1).
#           Plus the two behaviours
#           that exist nowhere else: the launchd PATH repair (a .app opened
#           through LaunchServices inherits /usr/bin:/bin:/usr/sbin:/sbin, not
#           the user's shell PATH, so `codex`,
#           `gh` and an nvm `node` are invisible to a double-clicked Calandria
#           until supervisor.js re-reads the PATH from the login shell) and
#           `titleBarStyle: "hiddenInset"`, whose traffic lights land inside the
#           page's own coordinate space over the app's titlebar row. Also the
#           only lane where the menu roles run under a real menubar, which on
#           macOS is where Cmd+C/V/A come from at all.
#           WEEKLY, not on push — the one job here that is not free-shaped.
#           macOS is the priciest runner GitHub rents (2026: $0.062/min on a
#           3-vCPU M1, ~10x Linux), and while a public repo pays nothing today,
#           a lane that costs ten times its neighbours should not be the one
#           that runs most often. The `schedule` trigger below exists for this
#           job alone, which is why the four always-on jobs opt out of it.
#   windows-e2e — `npm run test:e2e` on windows-latest. Same suite as `e2e`,
#           and gated by the SAME expression, on the same reasoning doubled:
#           a full `next build` plus a browser download plus a browser-driven
#           suite, on the slowest runner we rent, billed at 2x. It is the only
#           job that boots the Windows launcher (`scripts/start.mjs` ties
#           server.js and the pty sidecar together where there is no process
#           group to kill), so it is where the shipped `npm start` path is
#           exercised at all rather than only read.
#
# The Ubuntu three are independent jobs, not steps in one: they run
# concurrently, each reports its own red/green, and a type error does not hide
# behind a two-minute vitest run. Each does its own `npm ci` — setup-node caches
# npm's download cache (not node_modules), so the copies are isolated and
# concurrent restores of the same key are safe. `windows` is the deliberate
# exception: it runs both checks in ONE job, because a Windows runner bills at
# 2x and its `npm ci` (native module install, no Docker layer cache, slow
# filesystem) costs more than either check it is setting up for. Splitting it
# would pay that twice to shave a minute off a lane that is already the slow one.
#
# `windows-e2e` is NOT folded into `windows` for the opposite reason: that same
# argument only holds while the extra check is cheap next to the install it
# shares. e2e is not — it adds a full production build and a browser download —
# and it runs on a narrower schedule, so merging them would either serialize the
# two fast checks behind ~15 minutes on every push or drag them down to e2e's
# gate. Two jobs, each on its own schedule, is what that buys.
#
# `npm run preflight` (unit + e2e) is the documented pre-push gate locally; this
# file is the same pair plus the typecheck, split so the fast parts report fast.
name: Test

# `paths-ignore: website/**` keeps the site out of this gate. website/ is the
# calandria.dev Astro project (docs/design/WEBSITE.md) — its own package.json,
# its own lockfile, no import into the app — so a site-only change cannot break
# anything here, and running the Windows lanes plus a full production build for
# a copy edit is the wrong bill. website.yml builds and deploys it instead.
# Note this filter cannot hide a mixed change: a PR that touches website/ AND
# app code still runs, because paths-ignore skips only when EVERY changed file
# matches. docs/** is deliberately NOT ignored — docs live beside the code and
# a docs change can accompany one.
on:
  push:
    branches: [main]
    paths-ignore:
      - website/**
  pull_request:
    branches: [main]
    paths-ignore:
      - website/**
    # `labeled` is here so adding the `e2e` label to an open PR actually starts
    # an e2e run instead of waiting for the next push. The cost is that any
    # label change re-runs `unit`; the concurrency group below cancels the
    # superseded run, so it is one wasted job at worst.
    types: [opened, synchronize, reopened, labeled]
  # For `macos-desktop` and nothing else. Every other job in this file opts out
  # with `github.event_name != 'schedule'` (the four always-on ones) or by not
  # listing `schedule` in its gate (the four slow ones), so a weekly run is one
  # macOS job rather than a second full CI pass nobody asked for.
  #
  # Monday 05:23 UTC. The odd minute is GitHub's own advice — scheduled
  # workflows queue on the hour and a job on a scarce runner pool is the wrong
  # one to put in that queue — and the day means a red macOS lane is waiting at
  # the start of a week rather than discovered on a Friday.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the e2e suite (auto = yes for a manual run)"
        type: choice
        options: [auto, "on", "off"]
        default: auto
  # Called by publish-image.yml, which wants the unit gate without paying for
  # e2e a second time on the publish path.
  workflow_call:
    inputs:
      e2e:
        description: "auto (main/dispatch/labelled PR) | on (always) | off (never)"
        type: string
        default: auto

# NOT the same group string as publish-image.yml's. A reusable workflow's
# concurrency is evaluated in the CALLER's context, so `${{ github.workflow }}`
# here resolves to "Publish image" when that workflow calls us — sharing the
# group would have the called job queue behind the run that is waiting on it.
#
# `github.event_name` is in the group because only `pull_request` runs cancel,
# and without it one could cancel a push run (issue #48). `github.ref` was
# assumed to keep them apart — `refs/pull/N/merge` versus `refs/heads/main` —
# but release-please labels the ALREADY-MERGED release PR `autorelease: tagged`
# seconds after the merge, and the `labeled` run that fires for a closed PR
# collided with the push-to-main group and cancelled it. That happened on
# v0.3.0 and again on v0.4.0: the one run publish-image.yml's release gate
# waits for is the one that died, so no release has ever published its image
# from its own tag. Keying on the event makes the collision unrepresentable
# whatever a closed PR's ref resolves to, rather than resting on it resolving
# to something distinct.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job carries `if: ${{ !env.SKIP }}` in the form spelled out below —
# repeated rather than hoisted into a `needs:` guard job, because a required
# check that reports `skipped` instead of `success` is a merge people have to
# argue with, and there is no workflow-level `if`.
#
# What it screens out: a `pull_request` run for a CLOSED pull request. The
# `labeled` trigger is here so adding `e2e` to an open PR starts a run without
# waiting for a push, but it fires for a merged PR too, and release-please
# labels the release PR `autorelease: tagged` right after it merges. Running
# the full suite — two e2e lanes and a production build — against a PR nobody
# can merge is pure waste, and it was also the run that cancelled main's
# (issue #48; the concurrency group above now stops the cancelling half).
#
# Deliberately narrower than "only the `e2e` label counts": an OPEN PR behaves
# exactly as before, whatever label moved, so no required check on anything
# awaiting a merge can start reporting `skipped`. A closed PR is awaiting
# nothing, which is what makes skipping it safe.
jobs:
  audit:
    # Keep this name. security-scan.yml runs the identical command weekly and
    # used to answer to "Audit (npm)" as well; it is now "Audit (npm, weekly)"
    # precisely so this one can be named unambiguously as a required check.
    name: Audit (npm)
    # Two independent exclusions, both of which have to hold.
    #
    # The `schedule` trigger above exists for `macos-desktop` alone. Without
    # the first clause every always-on job would also run weekly against a
    # commit they already passed on push — a second full CI pass that reports
    # nothing new and, on the two Windows lanes, bills at 2x to do it. The four
    # slow jobs need no such guard: their gate lists the events they accept and
    # `schedule` is not among them.
    #
    # The second is the closed-PR clause shared with the slow lanes: the
    # `labeled` trigger fires for a merged PR too, and release-please labels
    # the release PR right after it merges.
    if: >-
      ${{ github.event_name != 'schedule'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # dependabot.yml excludes npm on the claim that `npm audit` covers it —
      # this job is what makes that claim true. --omit=dev matches what
      # actually ships; --audit-level=high fails on HIGH/CRITICAL only, so a
      # moderate advisory in a transitive dep doesn't red-flag every PR.
      - run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: Types (tsc)
    # Neither the weekly macOS schedule nor a closed PR — see `audit`.
    if: >-
      ${{ github.event_name != 'schedule'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run typecheck`, not an inline `npx tsc --noEmit`: the script is the
      # single definition of what "types are fine" means, so what a contributor
      # runs locally and what CI enforces cannot drift apart.
      #
      # The script's `next typegen` half matters on a cold checkout. Both
      # next-env.d.ts and .next/ are gitignored, and tsconfig.json's `include`
      # lists next-env.d.ts and .next/types/**/*.ts — which a fresh clone simply
      # does not have. tsc silently ignores a missing include entry rather than
      # erroring, so without typegen this job would quietly check LESS than
      # `next build` does while looking just as green. Two concrete gaps, both
      # verified against this tree:
      #
      #   - .next/types/validator.ts is what type-checks every App Router
      #     handler against its own route. Give app/api/tasks/[id]/route.ts a
      #     `params: Promise<{ wrongParamName: string }>` and bare tsc is happy;
      #     with typegen it fails, which is the whole point of the job.
      #   - The first `PageProps<'/x'>` anyone writes compiles under
      #     `next build` and fails here with "Cannot find name 'PageProps'" —
      #     a red PR caused by CI's setup rather than by the code.
      #
      # `next typegen` (Next 15.5+) writes both files with no bundling and takes
      # well under a second, so the job checks exactly the inputs the build
      # does. It is not a substitute for the build — bundler and runtime errors
      # still surface in `e2e` and in the Docker build.
      - run: npm run typecheck

  unit:
    name: Unit (vitest)
    # Neither the weekly macOS schedule nor a closed PR — see `audit`.
    if: >-
      ${{ github.event_name != 'schedule'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.state == 'open') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets engine-strict, so this also asserts the Node floor.
      - run: npm ci

      # vitest, serial on purpose (vitest.config.ts sets fileParallelism:false):
      # the tests shell out to a lot of real git subprocesses and four files in
      # parallel thrash the process table. Don't "fix" this with --threads.
      # No git identity is set up here on purpose — tests/setup.ts pins its own
      # GIT_CONFIG_GLOBAL, so a runner with no git config is the case it must
      # already handle.
      - run: npm test

  windows:
    name: Windows (types + unit)
    # Neither the weekly macOS schedule nor a closed PR — see `audit`. Doubly so
    # for the schedule half: this runner bills at 2x.
    if: >-
      ${{ github.event_name != 'schedule'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.state == 'open') }}
    runs-on: windows-latest
    # Generous next to `unit`'s 15: process spawning is far more expensive on
    # Windows and this suite shells out to git thousands of times.
    timeout-minutes: 30
    steps:
      # Before checkout, because it is the checkout these govern. Git for
      # Windows is preinstalled on the runner; neither setting is on by default
      # there, and both would otherwise change what the suite is even testing.
      #
      #   core.autocrlf — Git for Windows defaults to `true`, which would give
      #     this job a working tree whose every file differs from what Linux and
      #     macOS check out. Fixture bytes, diff assertions and mode lines are
      #     the suite's subject matter; `false` keeps it the same repository
      #     everywhere. (tests/setup.ts pins the same value inside the fixture
      #     repos it creates — this is the outer half, for the checkout itself.)
      #   core.longpaths — the checkout plus `node_modules` under
      #     D:\a\calandria\calandria\ gets close enough to MAX_PATH that a
      #     deep transitive dependency can fail the checkout outright. This is
      #     the same setting docs/TROUBLESHOOTING.md tells a Windows user to set.
      - name: Pin git's Windows checkout semantics
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --foreground-scripts so any install script's output reaches the log. It
      # should be a quiet step: better-sqlite3 13 sets `gypfile: false` and has
      # no `install` script at all, so nothing here compiles or downloads a
      # binary. That is what the next step exists to keep true.
      #
      # "Sets `gypfile: false`" is true of its manifest and was NOT enough on
      # its own, which is what had this job red. A lockfile entry carries only
      # a subset of a manifest and `gypfile` is not among the fields npm copies
      # into it, so `npm ci` — which builds its tree from the lockfile, never
      # from the real manifests — read it as unset, found the `binding.gyp`
      # still in the tarball, and synthesized `node-gyp rebuild` anyway
      # (`#addToBuildSet` in @npmcli/arborist/lib/arborist/rebuild.js). Every
      # npm from 10.9.3 to 12.0.2 does this; `npm install` does not, so the
      # instructions a Windows user follows were never affected. The fix is one
      # hand-written `"gypfile": false` in package-lock.json, which npm deletes
      # again on any lockfile regeneration — tests/lockfileGypfile.test.ts is
      # what makes that deletion loud, and reading it is the fastest way to
      # understand a failure in the step below.
      - run: npm ci --foreground-scripts

      # Fail loudly if the win32 binary did not come from the package itself.
      #
      # Rewritten for better-sqlite3 13, which changed what can go wrong. Up to
      # 12 the install was `prebuild-install || node-gyp rebuild`: it FETCHED a
      # binary matching the running Node's ABI and silently compiled one with
      # the runner's MSVC when that fetch found nothing. Both exited 0, so this
      # step read which had happened from the leftovers (build/config.gypi and
      # an MSBuild obj/ tree meant node-gyp). 13 is N-API and ships prebuilt
      # binaries for eight platform triples INSIDE the npm tarball, resolved at
      # require time by lib/binding.js — there is no ABI to match, no download,
      # and no install script to fall back from.
      #
      # So the failure this guards against is now a narrower one: better-sqlite3
      # dropping win32-x64 from the set it bundles, a future version going back
      # to compiling, or the lockfile losing the `gypfile` field above. All
      # three land on users as "gyp ERR! find VS", so a node-gyp path is a
      # failure here rather than a neutral substitute.
      #
      # This step used to add that a runner passes only because it happens to
      # ship MSVC build tools. That is no longer true and is worth knowing when
      # reading a red run: node-gyp 11.5.0 does not recognise the Visual Studio
      # 18 that `windows-latest` now ships ("unknown version undefined"), so a
      # node-gyp fallback here does not quietly compile — it dies in the `npm ci`
      # step above, before this one gets to report anything.
      #
      # `build/` is therefore the inverted signal: under 13 a prebuild leaves
      # none at all, so its mere existence means something compiled.
      - name: Assert better-sqlite3 loaded its bundled win32 prebuild
        shell: bash
        run: |
          pkg=node_modules/better-sqlite3
          if [ -d "$pkg/build" ]; then
            echo "::error::better-sqlite3 compiled from source: a build/ directory exists, which the bundled-prebuild path never creates. Read the npm ci step's output. Do not paper over this — a Windows user without MSVC gets a failed install."
            exit 1
          fi
          if [ ! -f "$pkg/prebuilds/win32-x64.node" ]; then
            echo "::error::better-sqlite3 ships no win32-x64 prebuild in its package. Check whether the version in package-lock.json dropped this platform triple."
            exit 1
          fi
          # A prebuild present on disk still has to LOAD. `better-sqlite3/win32-x64`
          # is an exported subpath that requires prebuilds/win32-x64.node directly,
          # with none of the main entry's fallback to node-gyp locations — so it
          # fails here rather than quietly succeeding via some other binary.
          # (lib/binding.js, which owns the resolution, is deliberately not used:
          # the exports map does not expose it, so requiring it is
          # ERR_PACKAGE_PATH_NOT_EXPORTED.)
          node -e "const D=require('better-sqlite3/win32-x64');const d=new D(':memory:');d.exec('create table t(x)');d.close();console.log('bundled win32-x64 prebuild loads and opens a database')"
          node -e "const D=require('better-sqlite3');const d=new D(':memory:');d.exec('create table t(x)');d.close();console.log('default entry point resolves the same way the app does')"

      # Same two scripts the Ubuntu lanes run, for the same reasons — see the
      # `typecheck` and `unit` jobs above. Run in that order so the cheap static
      # check reports before the long one starts.
      - run: npm run typecheck

      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    # inputs is null on push/pull_request, so the `!= 'off'` branch is the
    # default path there; only an explicit 'off' from a caller suppresses it.
    # The closed-PR clause is the one the other four jobs carry; a merged PR
    # would not normally hold the `e2e` label, but this is the pair of jobs
    # whose waste is measured in half-hours, so it does not rely on that.
    if: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.state == 'open')
          && (inputs.e2e == 'on'
              || (inputs.e2e != 'off'
                  && (github.event_name == 'push'
                      || github.event_name == 'workflow_dispatch'
                      || contains(github.event.pull_request.labels.*.name, 'e2e')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only — playwright.config.ts declares no other project.
      # --with-deps pulls the system libraries the runner image lacks.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # `test:e2e` is `npm run build && playwright test`, and the build MUST
      # come first: the suite runs `npm start`, i.e. the BUILT bundle, so
      # skipping it would silently test whatever was in .next before (there is
      # nothing here, so it would simply fail to boot). See e2e/README.md.
      # Everything else is self-contained: e2e/env.ts makes a temp root for the
      # DB, worktrees and fixture repos and pins its own gitconfig, and
      # CALANDRIA_E2E_MOCK_AGENT=1 swaps in the deterministic mock driver, so no
      # agent CLI, login, or network access is involved.
      - name: Build and run the e2e suite
        run: npm run test:e2e

      # traces (retain-on-failure) and screenshots land in test-results/.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop shell (Electron)
    # Byte-for-byte the same expression as `e2e` above, on purpose — see the
    # comment on `windows-e2e` below for why. This job keeps step with both:
    # the desktop shell serves the same build `e2e` exercises in a browser, so
    # there is no reason for its schedule to answer a different question.
    if: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.state == 'open')
          && (inputs.e2e == 'on'
              || (inputs.e2e != 'off'
                  && (github.event_name == 'push'
                      || github.event_name == 'workflow_dispatch'
                      || contains(github.event.pull_request.labels.*.name, 'e2e')))) }}
    runs-on: ubuntu-24.04
    # 45, not `e2e`'s 30: this job runs the window suite TWICE — once against
    # the dev shell, once against the packaged artifact — and pays for
    # electron-builder plus a payload stage (a production-only `npm ci` and a
    # vendored Node download) in between.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The only Linux-specific step in this job — a macOS or Windows desktop
      # lane would copy this job and drop exactly this step plus the
      # `xvfb-run` prefix on the final one. Electron's own `--headless` mode is
      # not a substitute: docs/DESKTOP_E2E.md §1 measured the process dying
      # with SIGTRAP before the CDP socket settles, so a virtual display is
      # mandatory here, not a preference.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Electron ships its own Chromium binary, so no browser download is
      # needed here — unlike the `e2e` job above, `playwright install` is
      # deliberately not run. But a bare runner image still lacks the shared
      # libraries that Chromium links against, and `install-deps` is the
      # maintained list of them.
      - name: Install Chromium's shared libraries
        run: npx playwright install-deps chromium

      # desktop/supervisor.js refuses to start without a production build at
      # .next/ and says so; desktop/test-real-boot.js and the window suite
      # both boot the real server.js.
      - name: Build the app the shell serves
        run: npm run build

      # desktop/ is its own private package (calandria-desktop) so ~280 MB of
      # Electron never lands in the app's node_modules, the Docker image, or
      # any other lane. The install script passes --include=dev and then runs
      # node desktop/node_modules/electron/install.js explicitly, because
      # Electron is a devDependency and any environment exporting
      # NODE_ENV=production makes npm install report "up to date" and fetch
      # nothing — see desktop/README.md.
      - name: Install Electron
        run: npm run desktop:install

      # Three scripts, none of which ran anywhere before this job existed.
      # test:desktop:supervisor (desktop/test-supervisor.js) is 21 headless
      # assertions over the process supervisor; test:desktop:boot
      # (desktop/test-real-boot.js) boots the real server.js/pty-server.js
      # through the supervisor. test:desktop:window is the Playwright
      # `_electron` suite in desktop/e2e/, under playwright.desktop.config.ts.
      # The sandbox is disabled here because an unpacked Electron has neither a
      # SUID chrome-sandbox helper nor an AppArmor profile permitting its user
      # namespace — that is CI-only, and the lane that tests a packaged install
      # sets CALANDRIA_DESKTOP_SANDBOX=1 so this is not what makes it pass
      # there.
      - name: Run the desktop suite
        run: xvfb-run -a npm run test:desktop

      # --- and now the same window suite against what a user downloads -----
      #
      # Everything above tests the shell running out of this checkout. That is
      # the developer's path, not anybody's install: the payload staging, the
      # asar, the vendored Node and the extraResources layout are all untested
      # by it, and the research spike (docs/DESKTOP_E2E.md §2) measured a
      # packaged app passing every assertion while still reading the repo.
      #
      # `--dir` only — no .deb/AppImage here. The unpacked tree is what the
      # suite can launch, and building installers on top would add minutes
      # (fpm on this payload takes several) to prove packaging steps this lane
      # still could not exercise: what makes the sandbox work is the .deb's
      # postinst, which installs an AppArmor profile — or, on a kernel without
      # user namespaces, the SUID bit — and only an INSTALL runs it. That run
      # is the bench lane's (docs/DESKTOP_E2E.md §4).
      - name: Package the desktop app
        working-directory: desktop
        run: |
          npm run payload -- --no-build
          npx electron-builder --linux dir

      # An installed app is never inside a source tree. Leaving the artifact at
      # desktop/dist/ would let anything that resolves upward — a module, a
      # lockfile, a relative path — find this repo and pass on a machine that
      # has one, which is precisely the false green being guarded against.
      # desktop/e2e/fixtures.ts refuses to launch a binary under the checkout,
      # so this move is a requirement rather than tidiness.
      - name: Move the artifact out of the checkout
        run: mv desktop/dist/linux-unpacked "$RUNNER_TEMP/calandria-app"

      # No CALANDRIA_DESKTOP_SANDBOX here, deliberately: nothing installed a
      # sandbox mechanism for `--dir` output, so the suite still disables it and
      # 06-packaged.spec.ts asserts that this pass is the disabled-sandbox one —
      # every process in the same user namespace. The un-flagged run belongs to
      # a real `.deb` install on the bench.
      - name: Run the desktop suite against the package
        env:
          CALANDRIA_TEST_BIN: ${{ runner.temp }}/calandria-app/calandria-desktop
        run: xvfb-run -a npm run test:desktop:window

      - name: Upload desktop artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-e2e:
    name: End-to-end (Playwright, Windows)
    # Byte-for-byte the same expression as `e2e` above, on purpose. A third
    # schedule (main-only, or always-on) would mean the `e2e` label no longer
    # answers "run the slow suites on this PR", and a Windows-specific
    # regression would surface on a different push than the Linux one it shares
    # a cause with. Keep the two in lockstep when either changes.
    if: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.state == 'open')
          && (inputs.e2e == 'on'
              || (inputs.e2e != 'off'
                  && (github.event_name == 'push'
                      || github.event_name == 'workflow_dispatch'
                      || contains(github.event.pull_request.labels.*.name, 'e2e')))) }}
    runs-on: windows-latest
    # Twice `e2e`'s 30. Same suite, but every process spawn, file write and
    # module load costs more here, and it pays for a production build on top.
    timeout-minutes: 60
    steps:
      # Same pair, same reasons, as the `windows` job — see there. They govern
      # the checkout, so they come before it.
      - name: Pin git's Windows checkout semantics
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No `--with-deps`, unlike the Ubuntu lane: that flag installs the shared
      # libraries a bare Linux container lacks, and on Windows it is either a
      # no-op or a Media Pack install for WebKit, which this suite does not use
      # (playwright.config.ts declares Chromium only).
      - name: Install the Playwright browser
        run: npx playwright install chromium

      # The whole point of this job. `npm start` here is scripts/start.mjs, the
      # Windows launcher that ties server.js and the pty sidecar together
      # without a process group to kill — CI has never executed it, only
      # type-checked and unit-tested around it. Everything else is as on Ubuntu:
      # e2e/env.ts makes a hermetic temp root (through realpathSync.native, so a
      # runner's 8.3-short-form %TEMP% resolves to the spelling the server
      # persists) and CALANDRIA_E2E_MOCK_AGENT=1 swaps in the mock driver.
      - name: Build and run the e2e suite
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-windows-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-desktop:
    name: Desktop shell (Electron, Windows)
    # The same expression again — see `windows-e2e` below for why all four slow
    # lanes share one gate rather than each having a schedule of its own.
    if: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.state == 'open')
          && (inputs.e2e == 'on'
              || (inputs.e2e != 'off'
                  && (github.event_name == 'push'
                      || github.event_name == 'workflow_dispatch'
                      || contains(github.event.pull_request.labels.*.name, 'e2e')))) }}
    #
    # GITHUB-HOSTED, NOT THE HOMELAB'S WINDOWS VM (Proxmox template 9911).
    # docs/DESKTOP_E2E.md §4 left that open; this lane closes it, and the
    # deciding question is what a real logged-in Windows session buys.
    #
    # For the LINUX desktop lane the answer was "quite a lot" — hence the bench
    # VM — because a runner there has no display at all and `xvfb-run` hides a
    # whole class of window-manager and compositor behaviour. Windows has no
    # equivalent gap for what this suite asserts: a hosted runner has a real
    # window station and desktop, Electron opens a genuine window on it, and
    # `01-shell.spec.ts` screenshots it. Note the absence of any display setup
    # in the steps below — that is the difference, not an omission.
    #
    # The two existing windows-latest jobs already prove the base this stands
    # on: `windows` runs the unit suite, and `windows-e2e` boots the real
    # server.js + pty sidecar through scripts/start.mjs and drives Chromium
    # against them. All this lane adds on top is Electron.
    #
    # And the costs run the other way. Hosted minutes are free on a public repo;
    # a self-hosted Windows runner would need a licence and an activation story,
    # its own fork-PR gating (a fork PR executing arbitrary code on a VM sitting
    # on VLAN 3), ephemeral registration with snapshot rollback, and patching —
    # none of which this suite's assertions would be any better for. The
    # native-integration specs that DO need a real session (tray icon with a
    # live shell, notification centre, window manager) are their own lane on the
    # bench, and remain so.
    runs-on: windows-latest
    # Twice the Ubuntu `desktop` job's 45: the same two passes that job makes
    # (dev shell, then the packaged artifact, with a payload stage in between)
    # on a runner where every process spawn costs more, plus Electron's ~100 MB
    # download.
    timeout-minutes: 90
    steps:
      # Same pair, same reasons, as the `windows` job — see there. They govern
      # the checkout, so they come before it.
      - name: Pin git's Windows checkout semantics
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No better-sqlite3 prebuild assertion here, unlike the `windows` job: it
      # runs on the same commit under the same gate, so duplicating it would
      # only mean two jobs reporting one fact. This lane still exercises the
      # module — desktop/test-real-boot.js and every _electron spec boot the
      # real server against a real database.
      - run: npm ci

      - name: Build the app the shell serves
        run: npm run build

      # See the Ubuntu `desktop` job: Electron lives in desktop/'s own private
      # package, and the install script passes --include=dev then runs
      # electron/install.js explicitly because a NODE_ENV=production environment
      # makes npm report "up to date" and fetch nothing.
      - name: Install Electron
        run: npm run desktop:install

      # No `xvfb-run` and no `--no-sandbox`. The Ubuntu lane needs both; this
      # one needs neither, and desktop/e2e/fixtures.ts gates the sandbox flag on
      # `process.platform === "linux"` precisely so the Windows lane is not
      # quietly testing an unsandboxed Chromium.
      #
      # The Windows-only specs live in desktop/e2e/05-windows-quit.spec.ts and
      # skip themselves everywhere else. 03-quit-drain's database assertion used
      # to carry a `test.fail(win32)` annotation, because the drain genuinely did
      # not happen here; the annotation came off when supervisor.stop() learned to
      # POST /api/instance/drain over loopback instead of relying on a signal
      # Windows cannot deliver, and the assertion is now expected to pass on
      # every platform.
      - name: Run the desktop suite
        run: npm run test:desktop

      # --- and now the same window suite against what a user downloads -----
      #
      # The Ubuntu lane's reasoning applies here unchanged: everything above
      # tests the shell running out of this checkout, which is the developer's
      # path and not anybody's install. The payload staging, the asar, the
      # vendored Node and the extraResources layout are untested by it.
      #
      # `--dir`, not the `nsis` and `zip` targets `dist:win` builds. The
      # unpacked tree is what the suite can launch, and it is also the payload
      # NSIS wraps, so this pass covers everything an installed Calandria
      # actually runs. What NSIS adds on top — a per-user install directory,
      # shortcuts, an uninstaller — is not what these specs assert, and the one
      # Windows-specific thing that IS worth knowing about the installer cannot
      # be observed from a runner at all: SmartScreen fires on the
      # `Zone.Identifier` stream a DOWNLOAD attaches, so an unsigned installer
      # built locally never trips the interstitial a user gets. That cost is
      # documented (docs/WINDOWS.md, docs/DESKTOP_APP.md §7) rather than tested.
      # Each command is exit-checked by hand because this job's shell is pwsh,
      # and GitHub's pwsh wrapper only propagates the LAST command's status:
      # `$ErrorActionPreference = 'stop'` governs cmdlet errors, not a native
      # command's non-zero exit. The Ubuntu lane needs no equivalent — its
      # `run:` block is `bash -e`, which aborts on the first failure.
      #
      # Without these guards a failed payload build sails straight on into
      # electron-builder, which logs `file source doesn't exist` for the missing
      # payload and vendored Node, packages an app around the hole, and exits 0 —
      # so the step goes GREEN and the failure surfaces fifteen minutes later as
      # every packaged spec timing out on a shell that boots, prints its payload
      # path and never becomes ready. That is exactly the false green this lane
      # exists to catch, so it must not be the lane's own reporting that hides it.
      - name: Package the desktop app
        working-directory: desktop
        run: |
          npm run payload -- --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # An installed app is never inside a source tree. Leaving the artifact at
      # desktop/dist/ would let anything that resolves upward — a module, a
      # lockfile, a relative path — find this repo and pass on a machine that
      # has one, which is precisely the false green being guarded against.
      # desktop/e2e/fixtures.ts refuses to launch a binary under the checkout,
      # so this move is a requirement rather than tidiness.
      - name: Move the artifact out of the checkout
        run: Move-Item desktop/dist/win-unpacked "$env:RUNNER_TEMP/calandria-app"

      # The executable takes its name from electron-builder's productName, and
      # there is no sandbox flag to think about on this side: fixtures.ts gates
      # `--no-sandbox` on `process.platform === "linux"`, so the packaged pass
      # here runs sandboxed exactly as the dev pass above did.
      - name: Run the desktop suite against the package
        env:
          CALANDRIA_TEST_BIN: ${{ runner.temp }}\calandria-app\Calandria.exe
        run: npm run test:desktop:window

      - name: Upload desktop artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-artifacts-windows-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  macos-desktop:
    name: Desktop shell (Electron, macOS)
    # NOT the shared `e2e` expression the other three slow lanes use, and that
    # is the one deliberate asymmetry in this file. Those three are gated to
    # keep CI fast; this one is also gated to keep it CHEAP — a macOS runner
    # bills at roughly ten times a Linux one, and hanging it off the `e2e`
    # label would mean every PR that wanted a browser run silently bought a Mac
    # run too. So: the weekly cron, a manual dispatch, and a PR that asks for it
    # by name with the `macos` label.
    #
    # GITHUB-HOSTED, AND NOT NEGOTIABLE HERE. The homelab has no Apple hardware
    # and macOS cannot be virtualised on Proxmox/KVM with any legal path, so
    # unlike the Linux bench VM and the Windows lane this one had no
    # alternative to weigh. docs/DESKTOP_E2E.md §4 records that.
    # The closed-PR clause is the other three lanes'; on the priciest runner in
    # the file it matters most, since a merged PR is awaiting nothing.
    if: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.pull_request.state == 'open')
          && (github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
              || contains(github.event.pull_request.labels.*.name, 'macos')) }}
    runs-on: macos-latest
    # Above the Ubuntu desktop lane's 45 and the Windows one's 60. Ubuntu's two
    # passes (dev shell, then the packaged artifact) plus one extra GUI launch,
    # and then two more specs against the app unpacked from the .dmg. Packaging
    # also builds three targets here rather than one, and zipping a bundle this
    # size is not free. That last pass is the whole point of building an
    # installer target: a .dmg that packages green and refuses to open is the
    # failure this lane exists to catch, and only launching what is inside it
    # proves otherwise.
    timeout-minutes: 70
    steps:
      # No `core.autocrlf`/`core.longpaths` pinning, unlike the Windows jobs:
      # macOS checks out with LF and has no MAX_PATH. The filesystem IS
      # case-insensitive like Windows', which lib/paths.ts case-folds for — and
      # that is already covered by `unit`, which this lane does not repeat.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # desktop/supervisor.js refuses to start without a production build at
      # .next/, and both test-real-boot.js and the window suite boot the real
      # server.js.
      - name: Build the app the shell serves
        run: npm run build

      # See the Ubuntu `desktop` job: Electron lives in desktop/'s own private
      # package, and the install script passes --include=dev then runs
      # electron/install.js explicitly because a NODE_ENV=production environment
      # makes npm report "up to date" and fetch nothing.
      - name: Install Electron
        run: npm run desktop:install

      # No display setup and no `--no-sandbox`, the same as the Windows lane and
      # unlike the Ubuntu one: a hosted macOS runner has a real WindowServer, so
      # Electron opens a genuine window on a genuine desktop with a genuine
      # menubar. desktop/e2e/fixtures.ts gates the sandbox flag on
      # `process.platform === "linux"`, so this lane is not quietly running an
      # unsandboxed Chromium either.
      #
      # 07-macos.spec.ts joins the shared specs here; 08-macos-launchd.spec.ts
      # skips itself for want of a bundle and runs in the packaged pass below.
      - name: Run the desktop suite
        run: npm run test:desktop

      # --- and now the same suite against what a user would download ---------
      #
      # All three of `mac.target`, and still unsigned in the Developer ID sense:
      # Gatekeeper and notarization stay a separate decision
      # (docs/DESKTOP_APP.md §6). `dir` is what the packaged pass below launches
      # and the only form the launchd spec can `open`; `dmg` and `zip` are what
      # a person would actually download, and building them here is the only way
      # to find out whether they open.
      - name: Package the desktop app
        working-directory: desktop
        env:
          # electron-builder otherwise scans the keychain for a Developer ID and
          # narrates its absence. `mac.identity: "-"` asks for an ad-hoc
          # signature rather than a real one, so there is nothing to discover.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # WITHOUT THIS THE .dmg SHIPS AN APP THAT CANNOT EXEC. electron-builder
          # skips macOS signing outright on any pull-request build
          # (`isSignAllowed` in app-builder-lib, which reads a set
          # GITHUB_BASE_REF as "this is a PR"), so on the labelled-PR trigger
          # that is most of this lane's runs the ad-hoc signature would silently
          # not happen — and arm64 macOS kills an unsigned Mach-O on launch.
          #
          # The warning that flag carries is about exposing a real signing
          # CERTIFICATE to fork PRs. There is no certificate here: an ad-hoc
          # signature carries no identity and this job has no CSC_LINK secret.
          # The lane also only fires on a maintainer-applied `macos` label,
          # which a fork cannot set on its own PR.
          #
          # THE SIGNING TASK MUST REMOVE THIS when a real Developer ID lands, at
          # which point the concern stops being inapplicable.
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          npm run payload -- --no-build
          npx electron-builder --mac dir dmg zip

      - name: Move the artifact out of the checkout
        # Same reason as the Ubuntu lane: an installed app is never inside a
        # source tree, and desktop/e2e/fixtures.ts refuses to launch a binary
        # under this checkout so that nothing can resolve upward into it.
        # The output directory is named for the arch (mac-arm64 on the current
        # hosted image, mac on an x64 one), so it is discovered rather than
        # spelled — as is the executable inside, which takes its name from
        # electron-builder's productName.
        run: |
          set -euo pipefail
          app=$(find desktop/dist -maxdepth 2 -name '*.app' -type d | head -n 1)
          test -n "$app" || { echo "::error::electron-builder produced no .app under desktop/dist"; exit 1; }
          mv "$app" "$RUNNER_TEMP/Calandria.app"
          bin=$(find "$RUNNER_TEMP/Calandria.app/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
          echo "CALANDRIA_TEST_BIN=$bin" >> "$GITHUB_ENV"
          echo "CALANDRIA_TEST_APP_BUNDLE=$RUNNER_TEMP/Calandria.app" >> "$GITHUB_ENV"

      # This step used to BE the ad-hoc signing (`codesign --force --deep --sign
      # -`). It moved into the build — `mac.identity: "-"` in
      # desktop/package.json — and what is left here is the assertion that it
      # happened. docs/DESKTOP_APP.md §6 records why; the short version is that
      # signing here is too late for an installer. electron-builder cuts the
      # .dmg and the .zip from the .app during the packaging step above, so a
      # signature applied afterwards, to a bundle already moved out of
      # desktop/dist, reaches the copy this lane tests and NOT the copies a user
      # would download. Both would ship an app the kernel kills.
      #
      # An ad-hoc signature is still not code signing in the sense §6 is about:
      # it carries no identity, satisfies no Gatekeeper policy and notarizes
      # nothing. It is only what makes the file runnable at all, because arm64
      # macOS will not exec a Mach-O with NO signature and electron-builder
      # invalidates the one Electron's prebuilt arrived with.
      #
      # Verifying rather than re-signing is deliberate: a second signing path
      # would paper over a build that quietly stopped signing (a dropped
      # CSC_FOR_PULL_REQUEST, say) and leave the .dmg broken with every pass
      # green. Failing here names the cause; failing later is a signal kill.
      - name: Check the build ad-hoc signed the bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Calandria.app"

      # Both variables are already in the environment from the move step:
      # CALANDRIA_TEST_BIN swaps every shared spec onto the artifact (with no
      # CALANDRIA_REPO_ROOT — see 06-packaged.spec.ts), and
      # CALANDRIA_TEST_APP_BUNDLE un-skips 08-macos-launchd.spec.ts, which
      # `open`s the bundle through LaunchServices to get the one launch no
      # child-process spec can produce: one whose environment comes from
      # launchd rather than from this job. Getting that required deleting PATH
      # from the environment handed to `open`, which forwards its caller's — so
      # the stub the spec plants with `launchctl setenv` is what the app reads.
      # What runs here is therefore the repair, not the inheritance that
      # triggers it; that premise stays a manual check on a real Mac, and the
      # domain's own PATH is printed every run as the evidence for it — to this
      # job's log, not only to an attachment, since a green run uploads no
      # artifacts. Grep for `[08-macos-launchd]`.
      # See the spec header and docs/DESKTOP_APP.md §5.
      - name: Run the desktop suite against the package
        run: npm run test:desktop:window

      # --- and now against what a user would actually download ---------------
      #
      # Everything above tests `dir` output — a bundle electron-builder left
      # lying in its own output directory. The .dmg is a different artifact: it
      # is cut from that bundle by hdiutil, and the question this lane cannot
      # answer any other way is whether the thing inside it still opens.
      #
      # The app is copied OFF the mounted image before anything launches it. The
      # mount is read-only, the app writes to its own bundle on first run, and
      # $RUNNER_TEMP is where the `dir` bundle already went — desktop/e2e/
      # fixtures.ts refuses to launch a binary from inside this checkout.
      - name: Unpack the app from the dmg
        # See the launch step below: the packaged pass carries a pre-existing
        # failure, and gating the installer checks behind it would mean the .dmg
        # goes unverified every run without saying so.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dmg=$(find desktop/dist -maxdepth 1 -name '*.dmg' -type f | head -n 1)
          test -n "$dmg" || { echo "::error::electron-builder produced no .dmg under desktop/dist"; exit 1; }
          echo "dmg: $dmg ($(du -h "$dmg" | cut -f1))"

          # -nobrowse keeps Finder out of it; the explicit mountpoint avoids
          # guessing at the volume name electron-builder derived from
          # productName.
          mnt="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"

          app=$(find "$mnt" -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::the dmg mounted but contains no .app"
            hdiutil detach "$mnt" -force || true
            exit 1
          fi

          # The signature has to survive the round trip through hdiutil. If it
          # did not, the copy below is a bundle the kernel will refuse to exec,
          # and this says so here rather than as a signal in the suite.
          codesign --verify --deep --strict --verbose=2 "$app"

          dest="$RUNNER_TEMP/dmg-app"
          rm -rf "$dest"; mkdir -p "$dest"
          # ditto, not cp: it preserves the signature and the bundle's symlinks.
          ditto "$app" "$dest/$(basename "$app")"
          hdiutil detach "$mnt" -force

          bin=$(find "$dest"/*.app/Contents/MacOS -maxdepth 1 -type f | head -n 1)
          echo "CALANDRIA_TEST_BIN=$bin" >> "$GITHUB_ENV"
          echo "CALANDRIA_TEST_APP_BUNDLE=$(find "$dest" -maxdepth 1 -name '*.app' -type d | head -n 1)" >> "$GITHUB_ENV"

          # Informational, and expected to FAIL. `spctl` is the Gatekeeper
          # assessment a downloaded copy gets, and an ad-hoc signature does not
          # pass it — that is the honest state of macOS distribution until the
          # signing task buys a Developer ID and notarizes. Printing the refusal
          # keeps §6's install instructions grounded in something observed
          # rather than assumed, so `|| true`: this is a report, not a gate.
          echo "--- spctl assessment (a refusal here is the documented state) ---"
          spctl --assess --type execute --verbose=4 "$dest"/*.app || true

      # Two specs, not the whole suite, and the reason the rest are absent is
      # that they would measure nothing. The app inside the .dmg is a `ditto`
      # copy of the very bundle the packaged pass just finished exercising —
      # identical bytes. The only things the round trip through hdiutil can
      # break are the signature (checked above) and whether the result still
      # launches, so re-running twenty UI specs against the same bytes buys
      # coverage that has already been paid for, on the priciest runner in this
      # file.
      #
      # 06-packaged is one launch: it boots the artifact named by
      # CALANDRIA_TEST_BIN, which the step above re-pointed at the dmg copy, and
      # asserts it serves.
      #
      # 08-macos-launchd is the other, and the better of the two, because it is
      # the only spec in the suite that opens the bundle the way a user who just
      # dragged it out of this .dmg would: through LaunchServices, with the
      # environment coming from launchd. It was dropped from this step while it
      # was independently red — `open` forwards its caller's environment, so the
      # planted stub PATH was shadowed by this job's — and is restored now that
      # the spec withholds PATH from `open` and reads launchd's value instead.
      #
      # Both come from CALANDRIA_TEST_APP_BUNDLE / CALANDRIA_TEST_BIN, which the
      # unpack step re-pointed at the dmg copy. playwright.desktop.config.ts is
      # `workers: 1`, so the two boots are sequential and cannot fight over the
      # single-instance lock.
      - name: Launch the app from the dmg
        # This step's dependency is the packaging step, not the suite above: a
        # skipped dmg check reads as "fine" when it is really "never ran".
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.desktop.config.ts 06-packaged 08-macos-launchd

      # The .zip is the load-bearing macOS artifact even though nothing consumes
      # it yet: Squirrel.Mac, which electron-updater uses on macOS, updates from
      # the .zip and not the .dmg, and a dmg-only build emits no latest-mac.yml
      # at all. Checking it exists and holds an intact bundle is cheap; the feed
      # itself arrives with the publish block in the auto-update task.
      - name: Check the zip carries an intact bundle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          zip=$(find desktop/dist -maxdepth 1 -name '*.zip' -type f | head -n 1)
          test -n "$zip" || { echo "::error::electron-builder produced no .zip under desktop/dist"; exit 1; }
          echo "zip: $zip ($(du -h "$zip" | cut -f1))"

          dest="$RUNNER_TEMP/zip-app"
          rm -rf "$dest"; mkdir -p "$dest"
          # ditto -x -k is the reader for the `ditto -c -k` archive
          # electron-builder writes; `unzip` drops the signature's extended
          # attributes and would fail the check below for the wrong reason.
          ditto -x -k "$zip" "$dest"
          app=$(find "$dest" -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$app" || { echo "::error::the zip contains no .app"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"

      # `always()`, not `failure()`, unlike every other lane here.
      # 07-macos.spec.ts attaches a screenshot of the hiddenInset title bar and
      # the element stack underneath the traffic lights, and the whole point of
      # those is that a human looks at them once on a GREEN run —
      # docs/DESKTOP_APP.md §5 has carried "needs a look on a real screen" since
      # the spike, and a failure-only upload would never deliver it.
      - name: Upload desktop artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-artifacts-macos-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
