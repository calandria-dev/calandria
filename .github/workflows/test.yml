# Run the test suites. This is the repo's correctness gate; publish-image.yml
# calls it (see `workflow_call` below) so a red suite can never reach ghcr.io.
#
# Four jobs, deliberately on different schedules:
#
#   audit — `npm audit --omit=dev --audit-level=high`. Seconds. Runs on
#           everything, always — the same coverage repeats weekly, unattended,
#           in security-scan.yml, so a newly-disclosed advisory against
#           unchanged code is still caught between pushes.
#   typecheck — `npm run typecheck` (next typegen + tsc --noEmit). Seconds.
#           Runs on everything, always. This repo has no lint script, so tsc IS
#           the static gate — and it otherwise only runs as a side effect of
#           `next build` (next.config.mjs does not set ignoreBuildErrors). That
#           build happens only in `e2e` below, which is main-only/label-gated,
#           and in the Docker build. Without this job an ordinary PR goes fully
#           green with a type error in it and the failure lands after merge, on
#           main, in a job that takes twenty times as long to tell you.
#   unit  — `npm test` (vitest). ~1-2 minutes. Runs on everything, always.
#   e2e   — `npm run test:e2e` (build + Playwright against the real prod server).
#           Many minutes: it does a full `next build`, boots server.js + the pty
#           sidecar against a hermetic temp instance, and drives a browser. Too
#           slow to sit in front of every PR push, so it runs on main, on manual
#           dispatch, and on a PR that carries the `e2e` label — the escape
#           hatch for a change that obviously touches the app's core flow.
#
# The three are independent jobs, not steps in one: they run concurrently, each
# reports its own red/green, and a type error does not hide behind a two-minute
# vitest run. Each does its own `npm ci` — setup-node caches npm's download
# cache (not node_modules), so the copies are isolated and concurrent restores
# of the same key are safe.
#
# `npm run preflight` (unit + e2e) is the documented pre-push gate locally; this
# file is the same pair plus the typecheck, split so the fast parts report fast.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` is here so adding the `e2e` label to an open PR actually starts
    # an e2e run instead of waiting for the next push. The cost is that any
    # label change re-runs `unit`; the concurrency group below cancels the
    # superseded run, so it is one wasted job at worst.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the e2e suite (auto = yes for a manual run)"
        type: choice
        options: [auto, "on", "off"]
        default: auto
  # Called by publish-image.yml, which wants the unit gate without paying for
  # e2e a second time on the publish path.
  workflow_call:
    inputs:
      e2e:
        description: "auto (main/dispatch/labelled PR) | on (always) | off (never)"
        type: string
        default: auto

# NOT the same group string as publish-image.yml's. A reusable workflow's
# concurrency is evaluated in the CALLER's context, so `${{ github.workflow }}`
# here resolves to "Publish image" when that workflow calls us — sharing the
# group would have the called job queue behind the run that is waiting on it.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # dependabot.yml excludes npm on the claim that `npm audit` covers it —
      # this job is what makes that claim true. --omit=dev matches what
      # actually ships; --audit-level=high fails on HIGH/CRITICAL only, so a
      # moderate advisory in a transitive dep doesn't red-flag every PR.
      - run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: Types (tsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run typecheck`, not an inline `npx tsc --noEmit`: the script is the
      # single definition of what "types are fine" means, so what a contributor
      # runs locally and what CI enforces cannot drift apart.
      #
      # The script's `next typegen` half matters on a cold checkout. Both
      # next-env.d.ts and .next/ are gitignored, and tsconfig.json's `include`
      # lists next-env.d.ts and .next/types/**/*.ts — which a fresh clone simply
      # does not have. tsc silently ignores a missing include entry rather than
      # erroring, so without typegen this job would quietly check LESS than
      # `next build` does while looking just as green. Two concrete gaps, both
      # verified against this tree:
      #
      #   - .next/types/validator.ts is what type-checks every App Router
      #     handler against its own route. Give app/api/tasks/[id]/route.ts a
      #     `params: Promise<{ wrongParamName: string }>` and bare tsc is happy;
      #     with typegen it fails, which is the whole point of the job.
      #   - The first `PageProps<'/x'>` anyone writes compiles under
      #     `next build` and fails here with "Cannot find name 'PageProps'" —
      #     a red PR caused by CI's setup rather than by the code.
      #
      # `next typegen` (Next 15.5+) writes both files with no bundling and takes
      # well under a second, so the job checks exactly the inputs the build
      # does. It is not a substitute for the build — bundler and runtime errors
      # still surface in `e2e` and in the Docker build.
      - run: npm run typecheck

  unit:
    name: Unit (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets engine-strict, so this also asserts the Node floor.
      - run: npm ci

      # vitest, serial on purpose (vitest.config.ts sets fileParallelism:false):
      # the tests shell out to a lot of real git subprocesses and four files in
      # parallel thrash the process table. Don't "fix" this with --threads.
      # No git identity is set up here on purpose — tests/setup.ts pins its own
      # GIT_CONFIG_GLOBAL, so a runner with no git config is the case it must
      # already handle.
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    # inputs is null on push/pull_request, so the `!= 'off'` branch is the
    # default path there; only an explicit 'off' from a caller suppresses it.
    if: >-
      ${{ inputs.e2e == 'on'
          || (inputs.e2e != 'off'
              && (github.event_name == 'push'
                  || github.event_name == 'workflow_dispatch'
                  || contains(github.event.pull_request.labels.*.name, 'e2e'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only — playwright.config.ts declares no other project.
      # --with-deps pulls the system libraries the runner image lacks.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # `test:e2e` is `npm run build && playwright test`, and the build MUST
      # come first: the suite runs `npm start`, i.e. the BUILT bundle, so
      # skipping it would silently test whatever was in .next before (there is
      # nothing here, so it would simply fail to boot). See e2e/README.md.
      # Everything else is self-contained: e2e/env.ts makes a temp root for the
      # DB, worktrees and fixture repos and pins its own gitconfig, and
      # ORCH_E2E_MOCK_AGENT=1 swaps in the deterministic mock driver, so no
      # agent CLI, login, or network access is involved.
      - name: Build and run the e2e suite
        run: npm run test:e2e

      # traces (retain-on-failure) and screenshots land in test-results/.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
