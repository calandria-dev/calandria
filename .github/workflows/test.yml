# Run the test suites. This is the repo's correctness gate; publish-image.yml
# calls it (see `workflow_call` below) so a red suite can never reach ghcr.io.
#
# Six jobs, deliberately on different schedules:
#
#   audit — `npm audit --omit=dev --audit-level=high`. Seconds. Runs on
#           everything, always — the same coverage repeats weekly, unattended,
#           in security-scan.yml, so a newly-disclosed advisory against
#           unchanged code is still caught between pushes.
#   typecheck — `npm run typecheck` (next typegen + tsc --noEmit). Seconds.
#           Runs on everything, always. This repo has no lint script, so tsc IS
#           the static gate — and it otherwise only runs as a side effect of
#           `next build` (next.config.mjs does not set ignoreBuildErrors). That
#           build happens only in the two e2e jobs, which are label-gated,
#           and in the Docker build. Without this job an ordinary PR goes fully
#           green with a type error in it and the failure lands after merge, on
#           main, in a job that takes twenty times as long to tell you.
#   unit  — `npm test` (vitest). ~1-2 minutes. Runs on everything, always.
#   e2e   — `npm run test:e2e` (build + Playwright against the real prod server).
#           Many minutes: it does a full `next build`, boots server.js + the pty
#           sidecar against a hermetic temp instance, and drives a browser. Too
#           slow to sit in front of every PR push, so it runs on main, on manual
#           dispatch, and on a PR that carries the `e2e` label — the escape
#           hatch for a change that obviously touches the app's core flow.
#   windows — `npm run typecheck` + `npm test` on windows-latest. Calandria
#           supports native Windows (docs/WINDOWS.md), and nothing else here
#           would notice it breaking: every other job runs on Ubuntu, so a
#           POSIX-only path spelling, a `/bin/sh` assumption or a process-group
#           kill sails through green. This lane is what makes the support claim
#           in README/INSTALLATION a fact rather than an intention.
#   windows-e2e — `npm run test:e2e` on windows-latest. Same suite as `e2e`,
#           and gated by the SAME expression, on the same reasoning doubled:
#           a full `next build` plus a browser download plus a browser-driven
#           suite, on the slowest runner we rent, billed at 2x. It is the only
#           job that boots the Windows launcher (`scripts/start.mjs` ties
#           server.js and the pty sidecar together where there is no process
#           group to kill), so it is where the shipped `npm start` path is
#           exercised at all rather than only read.
#
# The Ubuntu three are independent jobs, not steps in one: they run
# concurrently, each reports its own red/green, and a type error does not hide
# behind a two-minute vitest run. Each does its own `npm ci` — setup-node caches
# npm's download cache (not node_modules), so the copies are isolated and
# concurrent restores of the same key are safe. `windows` is the deliberate
# exception: it runs both checks in ONE job, because a Windows runner bills at
# 2x and its `npm ci` (native module install, no Docker layer cache, slow
# filesystem) costs more than either check it is setting up for. Splitting it
# would pay that twice to shave a minute off a lane that is already the slow one.
#
# `windows-e2e` is NOT folded into `windows` for the opposite reason: that same
# argument only holds while the extra check is cheap next to the install it
# shares. e2e is not — it adds a full production build and a browser download —
# and it runs on a narrower schedule, so merging them would either serialize the
# two fast checks behind ~15 minutes on every push or drag them down to e2e's
# gate. Two jobs, each on its own schedule, is what that buys.
#
# `npm run preflight` (unit + e2e) is the documented pre-push gate locally; this
# file is the same pair plus the typecheck, split so the fast parts report fast.
name: Test

# `paths-ignore: website/**` keeps the site out of this gate. website/ is the
# calandria.dev Astro project (docs/design/WEBSITE.md) — its own package.json,
# its own lockfile, no import into the app — so a site-only change cannot break
# anything here, and running the Windows lanes plus a full production build for
# a copy edit is the wrong bill. website.yml builds and deploys it instead.
# Note this filter cannot hide a mixed change: a PR that touches website/ AND
# app code still runs, because paths-ignore skips only when EVERY changed file
# matches. docs/** is deliberately NOT ignored — docs live beside the code and
# a docs change can accompany one.
on:
  push:
    branches: [main]
    paths-ignore:
      - website/**
  pull_request:
    branches: [main]
    paths-ignore:
      - website/**
    # `labeled` is here so adding the `e2e` label to an open PR actually starts
    # an e2e run instead of waiting for the next push. The cost is that any
    # label change re-runs `unit`; the concurrency group below cancels the
    # superseded run, so it is one wasted job at worst.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the e2e suite (auto = yes for a manual run)"
        type: choice
        options: [auto, "on", "off"]
        default: auto
  # Called by publish-image.yml, which wants the unit gate without paying for
  # e2e a second time on the publish path.
  workflow_call:
    inputs:
      e2e:
        description: "auto (main/dispatch/labelled PR) | on (always) | off (never)"
        type: string
        default: auto

# NOT the same group string as publish-image.yml's. A reusable workflow's
# concurrency is evaluated in the CALLER's context, so `${{ github.workflow }}`
# here resolves to "Publish image" when that workflow calls us — sharing the
# group would have the called job queue behind the run that is waiting on it.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # dependabot.yml excludes npm on the claim that `npm audit` covers it —
      # this job is what makes that claim true. --omit=dev matches what
      # actually ships; --audit-level=high fails on HIGH/CRITICAL only, so a
      # moderate advisory in a transitive dep doesn't red-flag every PR.
      - run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: Types (tsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `npm run typecheck`, not an inline `npx tsc --noEmit`: the script is the
      # single definition of what "types are fine" means, so what a contributor
      # runs locally and what CI enforces cannot drift apart.
      #
      # The script's `next typegen` half matters on a cold checkout. Both
      # next-env.d.ts and .next/ are gitignored, and tsconfig.json's `include`
      # lists next-env.d.ts and .next/types/**/*.ts — which a fresh clone simply
      # does not have. tsc silently ignores a missing include entry rather than
      # erroring, so without typegen this job would quietly check LESS than
      # `next build` does while looking just as green. Two concrete gaps, both
      # verified against this tree:
      #
      #   - .next/types/validator.ts is what type-checks every App Router
      #     handler against its own route. Give app/api/tasks/[id]/route.ts a
      #     `params: Promise<{ wrongParamName: string }>` and bare tsc is happy;
      #     with typegen it fails, which is the whole point of the job.
      #   - The first `PageProps<'/x'>` anyone writes compiles under
      #     `next build` and fails here with "Cannot find name 'PageProps'" —
      #     a red PR caused by CI's setup rather than by the code.
      #
      # `next typegen` (Next 15.5+) writes both files with no bundling and takes
      # well under a second, so the job checks exactly the inputs the build
      # does. It is not a substitute for the build — bundler and runtime errors
      # still surface in `e2e` and in the Docker build.
      - run: npm run typecheck

  unit:
    name: Unit (vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets engine-strict, so this also asserts the Node floor.
      - run: npm ci

      # vitest, serial on purpose (vitest.config.ts sets fileParallelism:false):
      # the tests shell out to a lot of real git subprocesses and four files in
      # parallel thrash the process table. Don't "fix" this with --threads.
      # No git identity is set up here on purpose — tests/setup.ts pins its own
      # GIT_CONFIG_GLOBAL, so a runner with no git config is the case it must
      # already handle.
      - run: npm test

  windows:
    name: Windows (types + unit)
    runs-on: windows-latest
    # Generous next to `unit`'s 15: process spawning is far more expensive on
    # Windows and this suite shells out to git thousands of times.
    timeout-minutes: 30
    steps:
      # Before checkout, because it is the checkout these govern. Git for
      # Windows is preinstalled on the runner; neither setting is on by default
      # there, and both would otherwise change what the suite is even testing.
      #
      #   core.autocrlf — Git for Windows defaults to `true`, which would give
      #     this job a working tree whose every file differs from what Linux and
      #     macOS check out. Fixture bytes, diff assertions and mode lines are
      #     the suite's subject matter; `false` keeps it the same repository
      #     everywhere. (tests/setup.ts pins the same value inside the fixture
      #     repos it creates — this is the outer half, for the checkout itself.)
      #   core.longpaths — the checkout plus `node_modules` under
      #     D:\a\calandria\calandria\ gets close enough to MAX_PATH that a
      #     deep transitive dependency can fail the checkout outright. This is
      #     the same setting docs/TROUBLESHOOTING.md tells a Windows user to set.
      - name: Pin git's Windows checkout semantics
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --foreground-scripts so any install script's output reaches the log. It
      # should be a quiet step: better-sqlite3 13 sets `gypfile: false` and has
      # no `install` script at all, so nothing here compiles or downloads a
      # binary. That is what the next step exists to keep true.
      #
      # "Sets `gypfile: false`" is true of its manifest and was NOT enough on
      # its own, which is what had this job red. A lockfile entry carries only
      # a subset of a manifest and `gypfile` is not among the fields npm copies
      # into it, so `npm ci` — which builds its tree from the lockfile, never
      # from the real manifests — read it as unset, found the `binding.gyp`
      # still in the tarball, and synthesized `node-gyp rebuild` anyway
      # (`#addToBuildSet` in @npmcli/arborist/lib/arborist/rebuild.js). Every
      # npm from 10.9.3 to 12.0.2 does this; `npm install` does not, so the
      # instructions a Windows user follows were never affected. The fix is one
      # hand-written `"gypfile": false` in package-lock.json, which npm deletes
      # again on any lockfile regeneration — tests/lockfileGypfile.test.ts is
      # what makes that deletion loud, and reading it is the fastest way to
      # understand a failure in the step below.
      - run: npm ci --foreground-scripts

      # Fail loudly if the win32 binary did not come from the package itself.
      #
      # Rewritten for better-sqlite3 13, which changed what can go wrong. Up to
      # 12 the install was `prebuild-install || node-gyp rebuild`: it FETCHED a
      # binary matching the running Node's ABI and silently compiled one with
      # the runner's MSVC when that fetch found nothing. Both exited 0, so this
      # step read which had happened from the leftovers (build/config.gypi and
      # an MSBuild obj/ tree meant node-gyp). 13 is N-API and ships prebuilt
      # binaries for eight platform triples INSIDE the npm tarball, resolved at
      # require time by lib/binding.js — there is no ABI to match, no download,
      # and no install script to fall back from.
      #
      # So the failure this guards against is now a narrower one: better-sqlite3
      # dropping win32-x64 from the set it bundles, a future version going back
      # to compiling, or the lockfile losing the `gypfile` field above. All
      # three land on users as "gyp ERR! find VS", so a node-gyp path is a
      # failure here rather than a neutral substitute.
      #
      # This step used to add that a runner passes only because it happens to
      # ship MSVC build tools. That is no longer true and is worth knowing when
      # reading a red run: node-gyp 11.5.0 does not recognise the Visual Studio
      # 18 that `windows-latest` now ships ("unknown version undefined"), so a
      # node-gyp fallback here does not quietly compile — it dies in the `npm ci`
      # step above, before this one gets to report anything.
      #
      # `build/` is therefore the inverted signal: under 13 a prebuild leaves
      # none at all, so its mere existence means something compiled.
      - name: Assert better-sqlite3 loaded its bundled win32 prebuild
        shell: bash
        run: |
          pkg=node_modules/better-sqlite3
          if [ -d "$pkg/build" ]; then
            echo "::error::better-sqlite3 compiled from source: a build/ directory exists, which the bundled-prebuild path never creates. Read the npm ci step's output. Do not paper over this — a Windows user without MSVC gets a failed install."
            exit 1
          fi
          if [ ! -f "$pkg/prebuilds/win32-x64.node" ]; then
            echo "::error::better-sqlite3 ships no win32-x64 prebuild in its package. Check whether the version in package-lock.json dropped this platform triple."
            exit 1
          fi
          # A prebuild present on disk still has to LOAD. `better-sqlite3/win32-x64`
          # is an exported subpath that requires prebuilds/win32-x64.node directly,
          # with none of the main entry's fallback to node-gyp locations — so it
          # fails here rather than quietly succeeding via some other binary.
          # (lib/binding.js, which owns the resolution, is deliberately not used:
          # the exports map does not expose it, so requiring it is
          # ERR_PACKAGE_PATH_NOT_EXPORTED.)
          node -e "const D=require('better-sqlite3/win32-x64');const d=new D(':memory:');d.exec('create table t(x)');d.close();console.log('bundled win32-x64 prebuild loads and opens a database')"
          node -e "const D=require('better-sqlite3');const d=new D(':memory:');d.exec('create table t(x)');d.close();console.log('default entry point resolves the same way the app does')"

      # Same two scripts the Ubuntu lanes run, for the same reasons — see the
      # `typecheck` and `unit` jobs above. Run in that order so the cheap static
      # check reports before the long one starts.
      - run: npm run typecheck

      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    # inputs is null on push/pull_request, so the `!= 'off'` branch is the
    # default path there; only an explicit 'off' from a caller suppresses it.
    if: >-
      ${{ inputs.e2e == 'on'
          || (inputs.e2e != 'off'
              && (github.event_name == 'push'
                  || github.event_name == 'workflow_dispatch'
                  || contains(github.event.pull_request.labels.*.name, 'e2e'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium only — playwright.config.ts declares no other project.
      # --with-deps pulls the system libraries the runner image lacks.
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      # `test:e2e` is `npm run build && playwright test`, and the build MUST
      # come first: the suite runs `npm start`, i.e. the BUILT bundle, so
      # skipping it would silently test whatever was in .next before (there is
      # nothing here, so it would simply fail to boot). See e2e/README.md.
      # Everything else is self-contained: e2e/env.ts makes a temp root for the
      # DB, worktrees and fixture repos and pins its own gitconfig, and
      # CALANDRIA_E2E_MOCK_AGENT=1 swaps in the deterministic mock driver, so no
      # agent CLI, login, or network access is involved.
      - name: Build and run the e2e suite
        run: npm run test:e2e

      # traces (retain-on-failure) and screenshots land in test-results/.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-e2e:
    name: End-to-end (Playwright, Windows)
    # Byte-for-byte the same expression as `e2e` above, on purpose. A third
    # schedule (main-only, or always-on) would mean the `e2e` label no longer
    # answers "run the slow suites on this PR", and a Windows-specific
    # regression would surface on a different push than the Linux one it shares
    # a cause with. Keep the two in lockstep when either changes.
    if: >-
      ${{ inputs.e2e == 'on'
          || (inputs.e2e != 'off'
              && (github.event_name == 'push'
                  || github.event_name == 'workflow_dispatch'
                  || contains(github.event.pull_request.labels.*.name, 'e2e'))) }}
    runs-on: windows-latest
    # Twice `e2e`'s 30. Same suite, but every process spawn, file write and
    # module load costs more here, and it pays for a production build on top.
    timeout-minutes: 60
    steps:
      # Same pair, same reasons, as the `windows` job — see there. They govern
      # the checkout, so they come before it.
      - name: Pin git's Windows checkout semantics
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No `--with-deps`, unlike the Ubuntu lane: that flag installs the shared
      # libraries a bare Linux container lacks, and on Windows it is either a
      # no-op or a Media Pack install for WebKit, which this suite does not use
      # (playwright.config.ts declares Chromium only).
      - name: Install the Playwright browser
        run: npx playwright install chromium

      # The whole point of this job. `npm start` here is scripts/start.mjs, the
      # Windows launcher that ties server.js and the pty sidecar together
      # without a process group to kill — CI has never executed it, only
      # type-checked and unit-tested around it. Everything else is as on Ubuntu:
      # e2e/env.ts makes a hermetic temp root (through realpathSync.native, so a
      # runner's 8.3-short-form %TEMP% resolves to the spelling the server
      # persists) and CALANDRIA_E2E_MOCK_AGENT=1 swaps in the mock driver.
      - name: Build and run the e2e suite
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts-windows-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
