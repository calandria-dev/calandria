name: Bug report
description: Report reproducible behavior that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Operator. Please search existing issues first and do not include secrets or private repository content.
  - type: input
    id: version
    attributes:
      label: Operator version or commit
      description: Use a release number or commit SHA when possible.
      placeholder: v0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Local npm install
        - Self-hosted Docker
        - Hosted Operator
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - OpenAI Codex
        - Both
        - Not agent-specific
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, Node version, and agent CLI version when relevant.
      placeholder: macOS 15, Chrome 136, Node 22.14, Claude Code 1.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and the impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Create…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or attach screenshots after removing credentials, tokens, and private code.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed credentials, tokens, and private repository content.
          required: true
