title: "[Question] "
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include relevant configuration and error text after removing secrets and private code.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Calandria version, installation method, OS, browser, and agent when relevant.
